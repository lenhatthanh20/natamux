[workspace]
members = ["xtask", "crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1.0.86"
async-tungstenite = { version = "0.33", features = ["tokio-runtime"] }
fastrand = "2.3"
futures = "0.3.34"
http-body-util = "0.1.3"
hyper = { version = "1.11", features = ["client", "http1"] }
hyper-util = { version = "0.1.17", features = ["tokio"] }
natamux-client = { path = "crates/natamux-client" }
natamux-proto = { path = "crates/natamux-proto" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.144"
tokio = { version = "1.52", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

# Zed crates: all at one rev, the v1.24.2 release (2026-10-14) plus one patch on the owner's fork
# (branch natamux/display-only-input-v1.24.2): a display-only terminal gives its input to the app.
# Upgrade them together, in their own PR (docs/plan-rust-migration.md, "Cargo workspace").
assets = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "34c3a6ba0fc9dfb2ca17358c466b329bd30ecad0" }
editor = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "34c3a6ba0fc9dfb2ca17358c466b329bd30ecad0" }
gpui = { version = "0.2.2", git = "https://github.com/lenhatthanh20/zed", rev = "34c3a6ba0fc9dfb2ca17358c466b329bd30ecad0" }
gpui_platform = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "34c3a6ba0fc9dfb2ca17358c466b329bd30ecad0", features = ["font-kit", "wayland", "x11"] }
release_channel = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "34c3a6ba0fc9dfb2ca17358c466b329bd30ecad0" }
settings = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "34c3a6ba0fc9dfb2ca17358c466b329bd30ecad0" }
terminal = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "34c3a6ba0fc9dfb2ca17358c466b329bd30ecad0" }
terminal_view = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "34c3a6ba0fc9dfb2ca17358c466b329bd30ecad0" }
theme = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "34c3a6ba0fc9dfb2ca17358c466b329bd30ecad0" }
theme_settings = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "34c3a6ba0fc9dfb2ca17358c466b329bd30ecad0" }
ui = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "34c3a6ba0fc9dfb2ca17358c466b329bd30ecad0" }
util = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "34c3a6ba0fc9dfb2ca17358c466b329bd30ecad0" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Zed's root manifest patches these crates, and a git dependency does not bring its patches.
# Copied from the same rev; drop an entry once no crate of the graph uses it.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
notify = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
notify-types = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "43623ec9bf0eaaf7113285c46e8a09018f181b18" }

[profile.release]
debug = "limited"

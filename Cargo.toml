[workspace]
members = ["xtask", "crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f", default-features = false }
anyhow = "1.0.86"
async-tungstenite = { version = "0.33", features = ["tokio-runtime"] }
base64 = "0.22.1"
fastrand = "2.3"
futures = "0.3.34"
getrandom = "0.3.4"
http-body-util = "0.1.3"
hyper = { version = "1.11", features = ["client", "http1"] }
hyper-util = { version = "0.1.17", features = ["tokio"] }
memchr = "2.8.3"
natamux-agents = { path = "crates/natamux-agents" }
natamux-client = { path = "crates/natamux-client" }
natamux-core = { path = "crates/natamux-core" }
natamux-git = { path = "crates/natamux-git" }
natamux-proto = { path = "crates/natamux-proto" }
natamux-pty = { path = "crates/natamux-pty" }
natamux-screen = { path = "crates/natamux-screen" }
natamux-stages = { path = "crates/natamux-stages" }
natamux-store = { path = "crates/natamux-store" }
nix = "0.30.1"
notify = "9.0.0-rc.4"
rusqlite = { version = "0.32.1", features = ["bundled"] }
ring = "0.17.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.144"
sha2 = "0.10.9"
subtle = "2.6.1"
tokio = { version = "1.52", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5.7"
yaml-rust2 = "0.13.0"

# Zed crates: all at one rev, the v1.24.2 release (2026-10-14) plus three patches on the owner's fork
# (branch natamux/display-only-input-v1.24.2): a display-only terminal gives its input to the app,
# parses its output off the main thread, and wakes at a pace the app sets.
# Upgrade them together, in their own PR (docs/plan-rust-migration.md, "Cargo workspace").
assets = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "c503ad015ddacc35d2d17f462b2a74750abbd118" }
buffer_diff = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "c503ad015ddacc35d2d17f462b2a74750abbd118" }
editor = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "c503ad015ddacc35d2d17f462b2a74750abbd118" }
grammars = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "c503ad015ddacc35d2d17f462b2a74750abbd118", features = ["load-grammars"] }
gpui = { version = "0.2.2", git = "https://github.com/lenhatthanh20/zed", rev = "c503ad015ddacc35d2d17f462b2a74750abbd118" }
gpui_platform = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "c503ad015ddacc35d2d17f462b2a74750abbd118", features = ["font-kit", "wayland", "x11"] }
markdown = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "c503ad015ddacc35d2d17f462b2a74750abbd118" }
language = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "c503ad015ddacc35d2d17f462b2a74750abbd118" }
release_channel = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "c503ad015ddacc35d2d17f462b2a74750abbd118" }
settings = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "c503ad015ddacc35d2d17f462b2a74750abbd118" }
text = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "c503ad015ddacc35d2d17f462b2a74750abbd118" }
terminal = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "c503ad015ddacc35d2d17f462b2a74750abbd118" }
terminal_view = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "c503ad015ddacc35d2d17f462b2a74750abbd118" }
theme = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "c503ad015ddacc35d2d17f462b2a74750abbd118" }
theme_settings = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "c503ad015ddacc35d2d17f462b2a74750abbd118" }
ui = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "c503ad015ddacc35d2d17f462b2a74750abbd118" }
# debug-embed: without it, debug builds look for the grammar queries in a Zed checkout.
util = { version = "0.1.0", git = "https://github.com/lenhatthanh20/zed", rev = "c503ad015ddacc35d2d17f462b2a74750abbd118", features = ["debug-embed"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Zed's root manifest patches these crates, and a git dependency does not bring its patches.
# Copied from the same rev; drop an entry once no crate of the graph uses it.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
notify = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
notify-types = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "43623ec9bf0eaaf7113285c46e8a09018f181b18" }

[profile.release]
debug = "limited"

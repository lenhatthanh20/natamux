# The Rust daemon beside the Node one, on top of compose.e2e.yaml, for the rust.yml
# daemon-contract job (docs/rust-phase4.md). Same image, user, repository and worktrees, so the
# shells of both daemons print the same; its own data folder (/data/rust, as /data belongs to
# the image's user) and port 4318. Both containers get
# the same host name, so the shell prompts match.
services:
  daemon:
    hostname: natamux
    # Contract job only: E2E's compose.e2e.yaml keeps the pauses.
    environment:
      NATAMUX_FAKE_AGENT_FAST: "1"

  daemon-rust:
    image: ${NATAMUX_DAEMON_IMAGE:-natamux-daemon:local}
    hostname: natamux
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/opt/natamux/bin/natamux-daemon"]
    command: []
    environment:
      NATAMUX_TOKEN: ${NATAMUX_TOKEN:?Set NATAMUX_TOKEN}
      NATAMUX_PORT: "4318"
      NATAMUX_DATA_DIR: /data/rust
      NATAMUX_WORKTREES_DIR: /data/worktrees
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /repo
      # The fake agent and the git identity of compose.e2e.yaml's daemon, for the stage scenarios.
      NATAMUX_CLAUDE_COMMAND: /opt/natamux/fake-agent.sh
      NATAMUX_FAKE_AGENT_FAST: "1"
      GIT_AUTHOR_NAME: Natamux e2e
      GIT_AUTHOR_EMAIL: e2e@example.invalid
      GIT_COMMITTER_NAME: Natamux e2e
      GIT_COMMITTER_EMAIL: e2e@example.invalid
    volumes:
      - ./target/x86_64-unknown-linux-musl/release/natamux-daemon:/opt/natamux/bin/natamux-daemon:ro
      - ./scripts/fake-agent.sh:/opt/natamux/fake-agent.sh:ro
      - e2e-repo:/repo
      - natamux-data:/data
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      daemon:
        condition: service_healthy

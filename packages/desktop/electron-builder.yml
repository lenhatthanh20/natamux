# Used by scripts/package-desktop.sh, which builds the app from a `pnpm deploy` copy of this package.
appId: dev.natamux.desktop
productName: Natamux
copyright: Copyright © 2026 lenhatthanh20 and the Natamux contributors
# Plain files: node-pty's helper program and the daemon's entry must be real files to run.
asar: false
npmRebuild: true
executableName: natamux
# Each architecture gets its own file name, so the files of all builds fit in one release.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
files:
  - dist/**
  - package.json
# The built dashboard only: its libraries are bundled into it already.
extraResources:
  - from: web-dist
    to: web
mac:
  target:
    - target: dmg
  category: public.app-category.developer-tools
  # Not signed with a certificate yet (build order step 11); after-pack.cjs signs it ad hoc.
  identity: null
win:
  target: nsis
linux:
  target:
    - AppImage
    - deb
    - tar.gz
  category: Development
  # `natamux` is the command line; the app gets its own name on the PATH.
  executableName: natamux-desktop
  synopsis: Run many coding agents in parallel
  maintainer: lenhatthanh20 <lenhatthanh20@users.noreply.github.com>
  vendor: Natamux

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Natamux has moved</title>
    <link rel="canonical" href="https://natamux.github.io/" />
    <script>
      // Keep the page path: /natamux/docs/x/ goes to /docs/x/.
      location.replace(
        'https://natamux.github.io' +
          location.pathname.replace(/^\/natamux/, '') +
          location.search +
          location.hash,
      )
    </script>
    <meta http-equiv="refresh" content="0; url=https://natamux.github.io/" />
  </head>
  <body>
    <p>Natamux moved to <a href="https://natamux.github.io/">natamux.github.io</a>.</p>
  </body>
</html>

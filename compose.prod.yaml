# Production: NATAMUX_TOKEN=<long random value> NATAMUX_REPO=/path/to/repo \
#   docker compose -f compose.prod.yaml up -d --build
# One address serves the dashboard and the API (/api): http://localhost:8080
# Read docs/docker.md first.
name: natamux

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  daemon:
    <<: *hardened
    build:
      context: .
      dockerfile: docker/prod.Dockerfile
      target: daemon
    image: natamux-daemon:local
    environment:
      NATAMUX_TOKEN: ${NATAMUX_TOKEN:?Set NATAMUX_TOKEN to a long random value}
      # git refuses a folder that another user owns, unless it is listed.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /repo
    volumes:
      - ${NATAMUX_REPO:?Set NATAMUX_REPO to the git repository}:/repo
      - natamux-data:/data
    # Not published: only the web container reaches it.
    expose:
      - "4317"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if command -v curl >/dev/null 2>&1; then
            curl --fail --silent http://127.0.0.1:4317/health >/dev/null;
          else
            node -e "require('http').get('http://127.0.0.1:4317/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))";
          fi
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    <<: *hardened
    build:
      context: .
      dockerfile: docker/prod.Dockerfile
      target: web
    image: natamux-web:local
    ports:
      - "${NATAMUX_BIND:-127.0.0.1}:${NATAMUX_PORT:-8080}:8080"
    # `up --wait` returns only when nginx answers.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      daemon:
        condition: service_healthy

volumes:
  natamux-data:

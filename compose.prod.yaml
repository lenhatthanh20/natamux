# The daemon for CI and codespace tests: use scripts/e2e.sh. Not a supported self-host.
# The API: http://localhost:8080/api. Read docs/docker.md first.
name: natamux

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  daemon:
    <<: *hardened
    build:
      context: .
      dockerfile: docker/prod.Dockerfile
      target: daemon
    image: natamux-daemon:local
    environment:
      NATAMUX_TOKEN: ${NATAMUX_TOKEN:?Set NATAMUX_TOKEN to a long random value}
      NATAMUX_ALLOWED_HOSTS: ${NATAMUX_ALLOWED_HOSTS:-daemon}
      # git refuses a folder that another user owns, unless it is listed.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /repo
    volumes:
      - ${NATAMUX_REPO:?Set NATAMUX_REPO to the git repository}:/repo
      - natamux-data:/data
    ports:
      - "${NATAMUX_BIND:-127.0.0.1}:${NATAMUX_PORT:-8080}:4317"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4317/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  natamux-data:

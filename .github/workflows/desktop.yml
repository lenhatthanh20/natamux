name: Desktop app

# Run by hand (Actions → Desktop app → Run workflow). Builds the app on GitHub's macOS and Windows
# machines and keeps the installers as artifacts of the run. Not signed yet (build order step 11).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Package
        shell: bash
        env:
          # The temp folder of the runner is on the drive of the checkout (see package-desktop.sh).
          TMPDIR: ${{ runner.temp }}
        run: scripts/package-desktop.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: natamux-${{ runner.os }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.exe
          retention-days: 3
          if-no-files-found: error

name: CI

on:
  push:
    # natamux-ci/* holds snapshots that tasks push for a CI check (Check on CI).
    branches: [main, 'natamux-ci/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Tests of the desktop app need no Electron runtime.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: scripts/e2e.test.sh
      - run: scripts/fake-agent.test.sh
      - run: scripts/release.test.sh
      - run: scripts/sign-release.test.sh
      - run: scripts/icons.test.sh
      - run: scripts/agents.test.sh
      - run: scripts/site-deploy.test.sh

  # The unit tests, split by file over three runners: one runner is CPU bound on them.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -r --if-present run test --shard=${{ matrix.shard }}/3 --passWithNoTests
        env:
          NATAMUX_BENCH: "1"

  # Apps trust updates signed by RELEASE_SIGNER only. Fails when it is not a minisign public key
  # (a placeholder) or is a test key, or when the docs do not show it.
  release-signer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The app embeds the real release public key
        run: |
          key=$(sed -n "s/^export const RELEASE_SIGNER = '\(.*\)'$/\1/p" packages/desktop/src/release-signature.ts)
          echo "RELEASE_SIGNER: $key"
          fails=0
          error() { echo "::error::$1"; fails=$((fails + 1)); }
          [[ $key =~ ^RW[A-Za-z0-9+/]{54}$ ]] || error "RELEASE_SIGNER is not a minisign public key (the placeholder?)"
          grep -rqxF -- "$key" packages/desktop/src/__tests__/fixtures && error "RELEASE_SIGNER is a test key from packages/desktop/src/__tests__/fixtures"
          for doc in SECURITY.md docs/release-process.md site/src/content/docs/docs/getting-started/install.mdx \
            site/src/content/docs/docs/help/security-and-privacy.md; do
            grep -qF -- "$key" "$doc" || error "$doc does not show RELEASE_SIGNER"
          done
          exit "$fails"

  # Node 24 is the next LTS line. Node 22 stays the one that the product targets.
  # Runs on main only: a natamux-ci/* push of the same work would run it twice.
  node-24:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # The product ships to macOS and Windows. Runs on main only, like node-24. Each system runs the
  # unit tests in three parts and starts the desktop app in a fourth, side by side.
  os:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        part: ['1', '2', '3', desktop]
    runs-on: ${{ matrix.os }}
    env:
      # Only the desktop part runs the app, so only it downloads the Electron runtime.
      ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ matrix.part != 'desktop' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - if: matrix.part != 'desktop'
        run: pnpm -r --if-present run test --shard=${{ matrix.part }}/3 --passWithNoTests
      # node-pty is built for Electron from here on, not for Node.js.
      - name: Desktop app, start and load the dashboard
        if: matrix.part == 'desktop'
        shell: bash
        env:
          NATAMUX_DESKTOP_SMOKE: "1"
          NATAMUX_DESKTOP_SMOKE_SHOT: ${{ runner.temp }}/desktop.png
        run: |
          pnpm --filter @natamux/desktop rebuild-native
          node -e "require('fs').mkdirSync(process.argv[1], { recursive: true }); require('fs').writeFileSync(process.argv[1] + '/settings.json', JSON.stringify({ repoDir: process.argv[2] }))" \
            "$RUNNER_TEMP/desktop-user" "$GITHUB_WORKSPACE"
          cd packages/desktop
          pnpm exec electron . --user-data-dir="$RUNNER_TEMP/desktop-user"
      - name: Desktop app, picture and log
        if: always() && matrix.part == 'desktop'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/desktop.png
            ${{ runner.temp }}/desktop-user/logs
          retention-days: 7
          if-no-files-found: ignore

  # No install here, so there is no pnpm store to cache.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm audit --audit-level=high

  # Starts the development setup and checks that it answers. The E2E workflow builds, starts and
  # tests the production images, so they are not built here too.
  docker:
    runs-on: ubuntu-latest
    env:
      NATAMUX_TOKEN: ci-token
      NATAMUX_REPO: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the compose files
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.prod.yaml config --quiet

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Development, start with the demo
        run: scripts/dev.sh demo
      - name: Development, smoke test
        run: |
          curl -fsS http://127.0.0.1:4317/health
          curl -fsS http://127.0.0.1:5173/ | grep -q 'id="root"'
          curl -fsS -H "Authorization: Bearer ci-token" http://127.0.0.1:5173/api/tasks
          curl -fsS -H "Authorization: Bearer ci-token" http://127.0.0.1:5173/api/tasks/T-0001/changes \
            | grep -q 'demo/todo.txt'
          curl -fsS -H "Authorization: Bearer ci-token" http://127.0.0.1:5173/api/tasks/T-0001/graph \
            | grep -q 'Expand demo notes'
      - name: Development, logs on failure
        if: failure()
        run: docker compose logs
      - name: Development, stop
        if: always()
        run: docker compose down -v

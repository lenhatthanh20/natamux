name: Web and core

on:
  push:
    branches: [main, 'natamux-ci/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-core-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # A required check of main's ruleset, with rust-ok of rust.yml; the name must stay unique.
  web-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: git rev-parse --verify -q origin/main || git fetch origin main
      - id: flags
        run: python3 scripts/ci-changes.py flags
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.flags.outputs.web == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.flags.outputs.web == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.flags.outputs.web == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.flags.outputs.web == 'true'
        run: pnpm exec biome check packages/core packages/web
      - if: steps.flags.outputs.web == 'true'
        run: pnpm --filter @natamux/core --filter @natamux/web build
      - if: steps.flags.outputs.web == 'true'
        run: pnpm --filter @natamux/core --filter @natamux/web typecheck
      - if: steps.flags.outputs.web == 'true'
        run: pnpm --filter @natamux/core --filter @natamux/web test

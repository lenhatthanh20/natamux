# Temporary (T-0005): converts the vendored Nerd Font to woff2 and uploads it as an artifact.
# Removed once the woff2 is committed.
name: Font woff2

on:
  push:
    branches: [natamux/t-0005-improve-ui-ux-of-termial]
    paths: [.github/workflows/font-woff2.yml]

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m venv /tmp/fonts && /tmp/fonts/bin/pip install fonttools==4.55.0 brotli==1.1.0
      - run: |
          /tmp/fonts/bin/python - <<'EOF'
          from fontTools.ttLib import TTFont
          font = TTFont('packages/web/src/assets/fonts/SymbolsNerdFontMono-Regular.ttf')
          font.flavor = 'woff2'
          font.save('SymbolsNerdFontMono-Regular.woff2')
          EOF
          ls -l SymbolsNerdFontMono-Regular.woff2
          sha256sum packages/web/src/assets/fonts/SymbolsNerdFontMono-Regular.ttf SymbolsNerdFontMono-Regular.woff2
      - uses: actions/upload-artifact@v7
        with:
          name: font-woff2
          path: SymbolsNerdFontMono-Regular.woff2

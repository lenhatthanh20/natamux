name: Site

# Builds the landing page and the docs in site/ and publishes them to the
# natamux/natamux.github.io repository: https://natamux.github.io/
# The Pages site of this repository only redirects the old address there.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      # site/ is its own project, outside the pnpm workspace of the app.
      - run: pnpm install --ignore-workspace --frozen-lockfile
        working-directory: site
      - run: pnpm build
        working-directory: site
      # The deploy job pushes this; on a pull request it is there to look at before it merges.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: site/dist
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/old-address

  # Its own job, because package scripts of pnpm install can set BASH_ENV for later steps of
  # the build job and read the deploy key there. This job runs no code from the repo or packages.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist
      # Pages actions deploy only to their own repository, so push the build
      # with a deploy key that can write to natamux.github.io.
      - name: Push to natamux.github.io
        working-directory: dist
        env:
          DEPLOY_SSH: ${{ secrets.PAGES_DEPLOY_SSH }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH" > ~/.ssh/pages
          chmod 600 ~/.ssh/pages
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          touch .nojekyll
          git init -q -b main
          git add -A
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Site from lenhatthanh20/natamux@${GITHUB_SHA}"
          GIT_SSH_COMMAND='ssh -i ~/.ssh/pages -o IdentitiesOnly=yes' \
            git push -f git@github.com:natamux/natamux.github.io.git main

  redirect:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

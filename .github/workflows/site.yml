name: Site

# Builds the landing page and the docs in site/ and publishes them to the
# natamux/natamux.github.io repository: https://natamux.github.io/
# The Pages site of this repository only redirects the old address there.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      # site/ is its own project, outside the pnpm workspace of the app.
      - run: pnpm install --ignore-workspace --frozen-lockfile
        working-directory: site
      - run: pnpm build
        working-directory: site
      # Lets a reviewer download the built site of a pull request and look at it.
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: site/dist
          retention-days: 7
      # Pages actions deploy only to their own repository, so push the build
      # with a deploy key that can write to natamux.github.io.
      - name: Push to natamux.github.io
        if: github.event_name != 'pull_request'
        working-directory: site/dist
        env:
          DEPLOY_SSH: ${{ secrets.PAGES_DEPLOY_SSH }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH" > ~/.ssh/pages
          chmod 600 ~/.ssh/pages
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          touch .nojekyll
          git init -q -b main
          git add -A
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Site from lenhatthanh20/natamux@${GITHUB_SHA}"
          GIT_SSH_COMMAND='ssh -i ~/.ssh/pages -o IdentitiesOnly=yes' \
            git push -f git@github.com:natamux/natamux.github.io.git main
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/old-address

  redirect:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

name: Release

# The owner signs SHA256SUMS.txt offline and publishes the draft with sign-release.sh.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish, or main for a dry run
        required: true
      publish:
        description: Draft a release after the build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.tag == 'main' && 'refs/heads/main' || format('refs/tags/{0}', inputs.tag)) || '' }}
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate release ref
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET_REF: ${{ inputs.tag }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run Release from main."
            exit 1
          fi
          case "$TARGET_REF" in
            main)
              if [ "$PUBLISH_RELEASE" = true ]; then
                echo "::error::A dry run of main cannot publish a release."
                exit 1
              fi
              ;;
            v*) ;;
            *)
              echo "::error::Use main or an existing v* tag."
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      # A tag on any other commit would run its own release.yml with the signing secrets.
      - name: Check the release commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::The release commit is not on main."
            exit 1
          }

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-arm64, os: macos-26, py: python3 }
          - { name: mac-x64, os: macos-26-intel, cache: rust-app-mac-intel, py: python3 }
          - { name: linux-x64, os: ubuntu-latest, py: python3 }
          - { name: win-x64, os: windows-latest, py: python }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CHECKOUT_REF }}
      - name: Check version and release notes
        if: github.event_name == 'push' || inputs.publish
        run: |
          test -f "docs/releases/$TAG.md"
          scripts/release.test.sh
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' crates/natamux-app/Cargo.toml | head -n 1)
          test "$version" = "${TAG#v}"
      - run: rustup toolchain install
      # Intel and Windows reuse compiled output from main on the same runner type. Other release
      # runners keep only downloads because their SDK or build profile differs from main.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ (matrix.name == 'mac-x64' || matrix.name == 'win-x64') && 'target' || '' }}
          key: ${{ matrix.cache || format('rust-app-{0}', runner.os) }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: ${{ matrix.cache || format('rust-app-{0}', runner.os) }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - name: Restore file times for cached Rust builds
        if: matrix.name == 'mac-x64' || matrix.name == 'win-x64'
        run: ${{ matrix.py }} scripts/ci-changes.py mtimes
      # The apt packages come from this cache: a run downloads only what it has not seen.
      - name: Make the apt cache writable
        if: runner.os == 'Linux'
        run: sudo chown -R "$USER" /var/cache/apt/archives
      - id: apt
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/release.yml') }}-${{ github.sha }}
          restore-keys: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/release.yml') }}-
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          # mesa-vulkan-drivers is a software Vulkan: without it the app has no surface in Xvfb.
          sudo apt-get install -y --no-install-recommends libasound2-dev libfontconfig-dev \
            libglib2.0-dev libssl-dev libva-dev libvulkan1 libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libzstd-dev libsqlite3-dev xvfb squashfs-tools dpkg-dev \
            mesa-vulkan-drivers
          gh release download 1.9.1 -R AppImage/appimagetool \
            -p appimagetool-x86_64.AppImage -D "$RUNNER_TEMP"
          gh release download 20251108 -R AppImage/type2-runtime \
            -p runtime-x86_64 -D "$RUNNER_TEMP"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool-x86_64.AppImage" | sha256sum -c
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $RUNNER_TEMP/runtime-x86_64" | sha256sum -c
          chmod +x "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
      - name: Save the apt cache
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.apt.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/release.yml') }}-${{ github.sha }}
      - name: Install Windows installer tool
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nsis-setup.exe" \
            "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13-setup.exe"
          echo "db9a1038bbc0e53fef24f423fd609979bd578e942f1be1198db186d1c42652a3  $RUNNER_TEMP/nsis-setup.exe" | sha256sum -c
          powershell -NoProfile -Command "Start-Process -Wait -FilePath '$(cygpath -w "$RUNNER_TEMP/nsis-setup.exe")' -ArgumentList '/S'"
          test -f "C:/Program Files (x86)/NSIS/makensis.exe"
      # The cache comes from app-macos on macos-15, and cargo does not rerun the build script of
      # a git crate. The build script of natamux-ui reads the SDK to size the traffic light
      # gutter.
      - name: Rebuild ui for this SDK
        if: runner.os == 'macOS'
        run: cargo clean --release -p natamux-ui
      - name: Build the app and its daemon
        run: cargo build --release --locked -p natamux-app -p natamux-daemon -p natamux-cli
      - name: Check the ui build matches the SDK
        if: runner.os == 'macOS'
        run: |
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "macOS SDK $sdk"
          if [ "${sdk%%.*}" -ge 26 ]; then
            grep -q macos_sdk_26_or_later target/release/build/natamux-ui-*/output
          fi
      - name: Start the app and its owned daemon
        timeout-minutes: 5
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            # The same start, with every address the app and its daemon reach written down: a
            # release build must not reach past loopback when it starts (scripts/net-trace.py).
            command -v strace >/dev/null || sudo apt-get install --yes --no-install-recommends strace
            strace -f -qq --seccomp-bpf -e trace=connect,sendto,sendmsg -o "$RUNNER_TEMP/net.trace" \
              xvfb-run -a scripts/release-smoke.sh target/release/natamux-app "$HOME/.config/Natamux"
            python3 scripts/net-trace.py "$RUNNER_TEMP/net.trace"
          elif [ "$RUNNER_OS" = Windows ]; then
            scripts/release-smoke.sh target/release/natamux-app.exe "$(cygpath -u "$APPDATA")/Natamux"
          else
            scripts/release-smoke.sh target/release/natamux-app "$HOME/Library/Application Support/Natamux"
          fi
      - name: Check the macOS signing scripts
        if: runner.os == 'macOS'
        run: bash scripts/mac-sign.test.sh
      # A release signs with the fixed certificate so macOS keeps privacy grants after an update.
      # Dry runs sign ad hoc.
      - name: Import the macOS signing certificate
        if: runner.os == 'macOS' && (github.event_name == 'push' || inputs.publish)
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          test -n "$MACOS_SIGN_P12" || { echo "::error::MACOS_SIGN_P12 is not set"; exit 1; }
          test -n "$MACOS_SIGN_P12_PASSWORD" || { echo "::error::MACOS_SIGN_P12_PASSWORD is not set"; exit 1; }
          umask 077
          base64 --decode <<<"$MACOS_SIGN_P12" > "$RUNNER_TEMP/natamux-codesign.p12"
          printf '%s' "$MACOS_SIGN_P12_PASSWORD" > "$RUNNER_TEMP/p12-password.txt"
          identity=$(scripts/import-mac-sign-cert.sh "$RUNNER_TEMP/natamux-codesign.p12" \
            "$RUNNER_TEMP/p12-password.txt" "$RUNNER_TEMP/natamux-sign.keychain-db")
          test -n "$identity" || { echo "::error::no Natamux Code Signing certificate in MACOS_SIGN_P12"; exit 1; }
          echo "NATAMUX_MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          scripts/package-rust-desktop.sh dist "${{ matrix.name }}"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/natamux-mnt" \
            "dist/Natamux-${{ matrix.name }}.dmg"
          scripts/release-smoke.sh \
            "$RUNNER_TEMP/natamux-mnt/Natamux.app/Contents/MacOS/natamux-app" \
            "$HOME/Library/Application Support/Natamux"
          hdiutil detach "$RUNNER_TEMP/natamux-mnt"
      - name: Check the last Electron updater's DMG contract
        if: runner.os == 'macOS'
        run: |
          git fetch --depth=1 origin legacy/electron
          git show FETCH_HEAD:packages/desktop/src/update/update-check.ts \
            | grep -Fq 'Natamux-mac-${arch}.dmg'
          git show FETCH_HEAD:packages/desktop/src/update/mac-install.ts \
            | grep -Fq "join(mount, 'Natamux.app')"
          mkdir -p "$RUNNER_TEMP/old-updater"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/natamux-mnt" \
            "dist/Natamux-${{ matrix.name }}.dmg"
          ditto "$RUNNER_TEMP/natamux-mnt/Natamux.app" \
            "$RUNNER_TEMP/old-updater/Natamux.app"
          hdiutil detach "$RUNNER_TEMP/natamux-mnt"
          codesign --verify --deep --strict "$RUNNER_TEMP/old-updater/Natamux.app"
          version=$(plutil -extract CFBundleShortVersionString raw -o - \
            "$RUNNER_TEMP/old-updater/Natamux.app/Contents/Info.plist")
          test "$version" = "$(sed -n 's/^version = "\([^"]*\)"$/\1/p' crates/natamux-app/Cargo.toml | head -n 1)"
      - name: Check the macOS signing scripts with shellcheck
        if: runner.os == 'Linux'
        run: |
          shellcheck scripts/make-mac-sign-cert.sh scripts/import-mac-sign-cert.sh \
            scripts/sign-mac-app.sh scripts/mac-sign.test.sh
      - name: Package Linux
        if: runner.os == 'Linux'
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool-x86_64.AppImage
          APPIMAGETOOL_RUNTIME_FILE: ${{ runner.temp }}/runtime-x86_64
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          scripts/package-rust-desktop.sh dist linux-x64
          xvfb-run -a scripts/release-smoke.sh dist/AppDir/AppRun "$HOME/.config/Natamux"
          xvfb-run -a scripts/release-smoke.sh \
            dist/Natamux-linux-x86_64.AppImage "$HOME/.config/Natamux"
          dist/Natamux-linux-x86_64.AppImage --appimage-extract >/dev/null
          test -f squashfs-root/usr/bin/natamux-daemon
          dpkg-deb -c dist/Natamux-linux-amd64.deb | grep natamux-daemon >/dev/null
          # Icons: the window matches the desktop file by app id (app/window_icon.rs).
          file squashfs-root/usr/share/icons/hicolor/256x256/apps/natamux.png | grep '256 x 256' >/dev/null
          grep -qx StartupWMClass=natamux squashfs-root/natamux.desktop
          dpkg-deb -c dist/Natamux-linux-amd64.deb | grep 'hicolor/256x256/apps/natamux.png' >/dev/null
          dpkg-deb --fsys-tarfile dist/Natamux-linux-amd64.deb |
            tar -xO ./usr/share/applications/natamux.desktop | grep -qx StartupWMClass=natamux
          tar -tzf dist/Natamux-linux-x64.tar.gz | grep -x './natamux.desktop' >/dev/null
      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          # NSIS needs Windows paths: with forward slashes File finds no files.
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' crates/natamux-app/Cargo.toml | head -n 1)
          "C:/Program Files (x86)/NSIS/makensis.exe" \
            -DROOT="$(cygpath -w "$PWD")" -DBIN="$(cygpath -w "$PWD/target/release")" -DOUT="$(cygpath -w "$PWD/dist")" \
            -DVERSION="$version" scripts/natamux-windows.nsi
          7z l dist/Natamux-win-x64.exe | grep natamux-daemon.exe >/dev/null
          7z x -y -o"$RUNNER_TEMP/unpacked" dist/Natamux-win-x64.exe >/dev/null
          test -f "$RUNNER_TEMP/unpacked/natamux-app.exe"
          test -f "$RUNNER_TEMP/unpacked/natamux.exe"
          # The icon gpui loads for the window and taskbar, and Explorer shows (build.rs).
          7z l "$RUNNER_TEMP/unpacked/natamux-app.exe" | grep GROUP_ICON >/dev/null
          # Code signing checks the product name and version of every signed file (build.rs, .nsi).
          for exe in natamux-app natamux-daemon natamux nmx; do
            name=$(powershell -NoProfile -Command "(Get-Item '$(cygpath -w "$RUNNER_TEMP/unpacked/$exe.exe")').VersionInfo.ProductName")
            [ "$(echo "$name" | tr -d '\r')" = Natamux ] || { echo "$exe.exe: ProductName is '$name'"; exit 1; }
          done
          ${{ matrix.py }} scripts/windows-crt-check.py "$RUNNER_TEMP"/unpacked/{natamux-app,natamux-daemon,natamux,nmx}.exe
          scripts/release-smoke.sh "$RUNNER_TEMP/unpacked/natamux-app.exe" \
            "$(cygpath -u "$APPDATA")/Natamux"
      # Run the real installer and uninstaller: Settings > Apps lists only apps with an
      # Uninstall key (T-0365).
      - name: Check the Windows install and uninstall
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path crates/natamux-app/Cargo.toml -Pattern '^version = "(.*)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Natamux'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Natamux'
          $run = Start-Process -FilePath dist\Natamux-win-x64.exe -ArgumentList '/S' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "The installer stopped with exit code $($run.ExitCode)." }
          $entry = Get-ItemProperty $key
          if ($entry.DisplayName -ne 'Natamux') { throw "DisplayName is '$($entry.DisplayName)'." }
          if ($entry.DisplayVersion -ne $version) { throw "DisplayVersion is '$($entry.DisplayVersion)', want '$version'." }
          if (-not ($entry.EstimatedSize -gt 0)) { throw "EstimatedSize is '$($entry.EstimatedSize)'." }
          $uninstaller = $entry.UninstallString.Trim('"')
          if (-not (Test-Path $uninstaller)) { throw "UninstallString '$uninstaller' is missing." }
          $icon = ($entry.DisplayIcon -split ',')[0].Trim('"')
          if (-not (Test-Path $icon)) { throw "DisplayIcon '$icon' is missing." }
          # The same list Settings > Apps reads.
          Get-Package -Name Natamux -ProviderName Programs | Out-Null
          # An update: the app runs the installer silently over the old copy, into its own folder.
          $run = Start-Process -FilePath dist\Natamux-win-x64.exe -ArgumentList "/S /D=$dir" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "The upgrade install stopped with exit code $($run.ExitCode)." }
          if (-not (Test-Path (Join-Path $dir 'natamux-app.exe'))) { throw 'natamux-app.exe is missing after the upgrade install.' }
          # A file in use must fail the install (exit 2), not be skipped.
          $lock = [System.IO.File]::Open((Join-Path $dir 'natamux-daemon.exe'), 'Open', 'Read', 'None')
          try {
            $run = Start-Process -FilePath dist\Natamux-win-x64.exe -ArgumentList "/S /D=$dir" -PassThru
            # A dialog in silent mode would hang the app's update; fail here instead.
            if (-not $run.WaitForExit(120000)) { $run.Kill(); throw 'The installer hung on a file in use.' }
            $run.WaitForExit()
          } finally {
            $lock.Close()
          }
          if ($run.ExitCode -eq 0) { throw 'The installer reported success with a file in use.' }
          # _?= makes the uninstaller run in place and wait, instead of a copy in TEMP.
          $run = Start-Process -FilePath $uninstaller -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "The uninstaller stopped with exit code $($run.ExitCode)." }
          if (Test-Path $key) { throw 'The Uninstall key is still there after uninstall.' }
          if (Test-Path (Join-Path $dir 'natamux-app.exe')) { throw 'natamux-app.exe is still there after uninstall.' }
      # The third-party crates of this build, for people who must list what they install.
      - name: Write the SBOM
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' crates/natamux-app/Cargo.toml | head -n 1)
          target=$(rustc -vV | sed -n 's/^host: //p')
          cargo metadata --locked --format-version 1 --filter-platform "$target" |
            ${{ matrix.py }} scripts/sbom.py "$version" "$target" > "dist/Natamux-${{ matrix.name }}.cdx.json"
          test -s "dist/Natamux-${{ matrix.name }}.cdx.json"
      - name: Keep startup logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-logs-${{ matrix.name }}
          path: ${{ runner.temp }}/**/logs/*.log
          if-no-files-found: ignore
          retention-days: 3
      # The attest service sometimes answers 404 for its tlog. Retry twice; the last try must pass.
      - id: attest1
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-path: dist/Natamux-*
      - if: steps.attest1.outcome == 'failure'
        run: sleep 60
      - id: attest2
        if: steps.attest1.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-path: dist/Natamux-*
      - if: steps.attest1.outcome == 'failure' && steps.attest2.outcome == 'failure'
        run: sleep 120
      - id: attest3
        if: steps.attest1.outcome == 'failure' && steps.attest2.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Natamux-*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: natamux-${{ matrix.name }}
          path: dist/Natamux-*
          retention-days: 3
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: natamux-*
          merge-multiple: true
      - name: Check the assets
        run: |
          for file in Natamux-mac-arm64.dmg Natamux-mac-x64.dmg Natamux-win-x64.exe \
            Natamux-linux-x86_64.AppImage Natamux-linux-amd64.deb Natamux-linux-x64.tar.gz \
            Natamux-mac-arm64.cdx.json Natamux-mac-x64.cdx.json Natamux-win-x64.cdx.json \
            Natamux-linux-x64.cdx.json; do
            test -s "artifacts/$file" || { echo "missing $file" >&2; exit 1; }
          done
          test "$(find artifacts -maxdepth 1 -type f -name 'Natamux-*' | wc -l)" -eq 10
          cd artifacts
          sha256sum Natamux-* > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: artifacts/*
          retention-days: 3
      - name: Draft the release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$draft" = true ]; then
            gh release upload "$TAG" artifacts/* --clobber
          elif [ -n "$draft" ]; then
            echo "Release $TAG is published already" >&2
            exit 1
          else
            gh release create "$TAG" --draft --verify-tag \
              --title "Natamux $TAG" --notes-file "docs/releases/$TAG.md" artifacts/*
          fi

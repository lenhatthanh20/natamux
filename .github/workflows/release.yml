name: Release

# Pushing a tag such as v0.1.0 builds the desktop app for macOS (Apple silicon and Intel), Linux
# x64 and Windows x64, then publishes one GitHub release with every file. The notes come from
# docs/releases/<tag>.md. Not signed with a certificate yet (build order step 11). A pull request
# that changes the packaging builds and starts the app on every system, without a release.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package-desktop.sh
      - packages/desktop/**
      - packages/daemon/package.json
      - pnpm-lock.yaml
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, such as v0.1.0, or a branch for a dry run
        required: true
      publish:
        description: Publish a release. Off for a dry run that only builds and tests.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-arm64, os: macos-26, args: --mac --arm64 }
          - { name: mac-x64, os: macos-26-intel, args: --mac --x64 }
          - { name: linux-x64, os: ubuntu-latest, args: --linux --x64 }
          - { name: win-x64, os: windows-latest, args: --win --x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request builds its merge commit.
          ref: ${{ github.event_name != 'pull_request' && env.TAG || '' }}
      - name: Check the version
        if: github.event_name == 'push'
        shell: bash
        run: |
          test -f "docs/releases/$TAG.md" || { echo "docs/releases/$TAG.md is missing"; exit 1; }
          for dir in cli core daemon desktop web; do
            version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' "packages/$dir/package.json")
            test "$version" = "${TAG#v}" || { echo "packages/$dir is $version, not ${TAG#v}"; exit 1; }
          done
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Package
        shell: bash
        run: scripts/package-desktop.sh ${{ matrix.args }} --publish never
      # Each start also opens a task: a shell in its worktree must answer, and a stand-in agent
      # must run the app's own `natamux` command (packages/desktop/src/smoke.ts).
      - name: Start the packaged app (Linux)
        if: runner.os == 'Linux'
        env:
          NATAMUX_DESKTOP_SMOKE: "1"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          printf '#!/bin/sh\nnatamux task show > natamux-smoke.txt\n' > "$RUNNER_TEMP/smoke-agent"
          chmod +x "$RUNNER_TEMP/smoke-agent"
          export NATAMUX_CLAUDE_COMMAND="$RUNNER_TEMP/smoke-agent"
          user_dir="$RUNNER_TEMP/desktop-user"
          mkdir -p "$user_dir"
          jq -n --arg repoDir "$GITHUB_WORKSPACE" '{$repoDir}' > "$user_dir/settings.json"
          xvfb-run -a packages/desktop/release/linux-unpacked/natamux-desktop --no-sandbox --user-data-dir="$user_dir"
      # Acting as version 0.0.0, the new app must download the AppImage of the latest release,
      # check it and put it in its own place.
      - name: Update to the latest release (dry run)
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && !inputs.publish
        env:
          NATAMUX_UPDATE_AS_VERSION: 0.0.0
          APPIMAGE_EXTRACT_AND_RUN: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=Natamux-linux-x86_64.AppImage
          gh release view --json assets --jq '.assets[].name' | grep -qx "$asset" \
            || { echo "::notice::The latest release has no $asset; the update check is skipped"; exit 0; }
          user_dir="$RUNNER_TEMP/update-user"
          mkdir -p "$user_dir"
          jq -n --arg repoDir "$GITHUB_WORKSPACE" '{$repoDir}' > "$user_dir/settings.json"
          app="$RUNNER_TEMP/Natamux.AppImage"
          cp "packages/desktop/release/$asset" "$app"
          timeout 240 xvfb-run -a "$app" --no-sandbox --user-data-dir="$user_dir" || true
          cat "$user_dir/logs/update.log"
          gh release download --pattern SHA256SUMS.txt --output - \
            | grep " $asset\$" | sed "s| .*|  $app|" | sha256sum -c
      - name: Start the packaged app (macOS)
        if: runner.os == 'macOS'
        env:
          NATAMUX_DESKTOP_SMOKE: "1"
        run: |
          printf '#!/bin/sh\nnatamux task show > natamux-smoke.txt\n' > "$RUNNER_TEMP/smoke-agent"
          chmod +x "$RUNNER_TEMP/smoke-agent"
          export NATAMUX_CLAUDE_COMMAND="$RUNNER_TEMP/smoke-agent"
          user_dir="$RUNNER_TEMP/desktop-user"
          mkdir -p "$user_dir"
          jq -n --arg repoDir "$GITHUB_WORKSPACE" '{$repoDir}' > "$user_dir/settings.json"
          app=$(ls -d packages/desktop/release/mac*/Natamux.app | head -n 1)
          "$app/Contents/MacOS/Natamux" --user-data-dir="$user_dir"
      # Acting as version 0.0.0, a copy of the new app must download the .dmg of the latest
      # release, check it and unpack a Natamux.app of that version. Killed before it quits, so the
      # copy is not replaced.
      - name: Update to the latest release (dry run, macOS)
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && !inputs.publish
        env:
          NATAMUX_UPDATE_AS_VERSION: 0.0.0
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=Natamux-${{ matrix.name }}.dmg
          gh release view --json assets --jq '.assets[].name' | grep -qx "$asset" \
            || { echo "::notice::The latest release has no $asset; the update check is skipped"; exit 0; }
          user_dir="$RUNNER_TEMP/update-user"
          mkdir -p "$user_dir"
          jq -n --arg repoDir "$GITHUB_WORKSPACE" '{$repoDir}' > "$user_dir/settings.json"
          app="$RUNNER_TEMP/Natamux.app"
          ditto "$(ls -d packages/desktop/release/mac*/Natamux.app | head -n 1)" "$app"
          "$app/Contents/MacOS/Natamux" --user-data-dir="$user_dir" &
          pid=$!
          log="$user_dir/logs/update.log"
          for _ in $(seq 240); do
            grep -qE ' (ready|failed): ' "$log" 2>/dev/null && break
            sleep 1
          done
          kill -9 "$pid" || true
          cat "$log"
          grep -q ' ready: ' "$log"
          latest=$(gh release view --json tagName --jq .tagName)
          version=$(plutil -extract CFBundleShortVersionString raw "$user_dir"/updates/*/Natamux.app/Contents/Info.plist)
          test "$version" = "${latest#v}"
      # Windows updates by hand (the app opens the release page), so it has no update check.
      - name: Start the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          NATAMUX_DESKTOP_SMOKE: "1"
        run: |
          printf '@call natamux task show > natamux-smoke.txt\r\n' > "$RUNNER_TEMP/smoke-agent.cmd"
          export NATAMUX_CLAUDE_COMMAND="$RUNNER_TEMP\\smoke-agent.cmd"
          user_dir="$RUNNER_TEMP/desktop-user"
          mkdir -p "$user_dir"
          jq -n --arg repoDir "$GITHUB_WORKSPACE" '{$repoDir}' > "$user_dir/settings.json"
          packages/desktop/release/win-unpacked/Natamux.exe --user-data-dir="$user_dir"
      - name: Keep the logs of a failed start
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-${{ matrix.name }}
          path: ${{ runner.temp }}/desktop-user/logs
          retention-days: 3
          if-no-files-found: ignore
      # The release job of the same run takes the files at once; a dry run's stay for a day.
      - uses: actions/upload-artifact@v7
        with:
          name: natamux-${{ matrix.name }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.tar.gz
            packages/desktop/release/*.exe
          retention-days: 1
          if-no-files-found: error

  release:
    if: github.event_name == 'push' || inputs.publish
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Natamux ${{ env.TAG }}
          body_path: docs/releases/${{ env.TAG }}.md
          files: artifacts/*
          prerelease: ${{ contains(env.TAG, '-') }}

name: Release

# Pushing a tag such as v0.1.0 builds the desktop app for macOS on Apple silicon, then publishes
# one GitHub release with every file. The Intel Mac and Linux builds are paused to save storage;
# uncomment their matrix lines to release them again. The notes come from
# docs/releases/<tag>.md. Not signed with a certificate yet (build order step 11).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, such as v0.1.0, or a branch for a dry run
        required: true
      publish:
        description: Publish a release. Off for a dry run that only builds and tests.
        type: boolean
        default: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-arm64, os: macos-26, args: --mac --arm64 }
          # Paused. Uncomment to release these again.
          # - { name: mac-x64, os: macos-26-intel, args: --mac --x64 }
          # - { name: linux-x64, os: ubuntu-latest, args: --linux --x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Package
        run: scripts/package-desktop.sh ${{ matrix.args }} --publish never
      - name: Start the packaged app (Linux)
        if: runner.os == 'Linux'
        env:
          NATAMUX_DESKTOP_SMOKE: "1"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          user_dir="$RUNNER_TEMP/desktop-user"
          mkdir -p "$user_dir"
          printf '{"repoDir":"%s"}' "$GITHUB_WORKSPACE" > "$user_dir/settings.json"
          xvfb-run -a packages/desktop/release/linux-unpacked/natamux-desktop --no-sandbox --user-data-dir="$user_dir"
      # Acting as version 0.0.0, the new app must download the AppImage of the latest release,
      # check it and put it in its own place.
      - name: Update to the latest release (dry run)
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && !inputs.publish
        env:
          NATAMUX_UPDATE_AS_VERSION: 0.0.0
          APPIMAGE_EXTRACT_AND_RUN: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          user_dir="$RUNNER_TEMP/update-user"
          mkdir -p "$user_dir"
          printf '{"repoDir":"%s"}' "$GITHUB_WORKSPACE" > "$user_dir/settings.json"
          app="$RUNNER_TEMP/Natamux.AppImage"
          cp packages/desktop/release/Natamux-linux-x86_64.AppImage "$app"
          timeout 240 xvfb-run -a "$app" --no-sandbox --user-data-dir="$user_dir" || true
          cat "$user_dir/logs/update.log"
          gh release download --pattern SHA256SUMS.txt --output - \
            | grep ' Natamux-linux-x86_64.AppImage$' | sed "s| .*|  $app|" | sha256sum -c
      - name: Start the packaged app (macOS)
        if: runner.os == 'macOS'
        env:
          NATAMUX_DESKTOP_SMOKE: "1"
        run: |
          user_dir="$RUNNER_TEMP/desktop-user"
          mkdir -p "$user_dir"
          printf '{"repoDir":"%s"}' "$GITHUB_WORKSPACE" > "$user_dir/settings.json"
          app=$(ls -d packages/desktop/release/mac*/Natamux.app | head -n 1)
          "$app/Contents/MacOS/Natamux" --user-data-dir="$user_dir"
      # Acting as version 0.0.0, a copy of the new app must download the .dmg of the latest
      # release, check it and unpack a Natamux.app of that version. Killed before it quits, so the
      # copy is not replaced.
      - name: Update to the latest release (dry run, macOS)
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && !inputs.publish
        env:
          NATAMUX_UPDATE_AS_VERSION: 0.0.0
          GH_TOKEN: ${{ github.token }}
        run: |
          user_dir="$RUNNER_TEMP/update-user"
          mkdir -p "$user_dir"
          printf '{"repoDir":"%s"}' "$GITHUB_WORKSPACE" > "$user_dir/settings.json"
          app="$RUNNER_TEMP/Natamux.app"
          ditto "$(ls -d packages/desktop/release/mac*/Natamux.app | head -n 1)" "$app"
          "$app/Contents/MacOS/Natamux" --user-data-dir="$user_dir" &
          pid=$!
          log="$user_dir/logs/update.log"
          for _ in $(seq 240); do
            grep -qE ' (ready|failed): ' "$log" 2>/dev/null && break
            sleep 1
          done
          kill -9 "$pid" || true
          cat "$log"
          grep -q ' ready: ' "$log"
          latest=$(gh release view --json tagName --jq .tagName)
          version=$(plutil -extract CFBundleShortVersionString raw "$user_dir"/updates/*/Natamux.app/Contents/Info.plist)
          test "$version" = "${latest#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: natamux-${{ matrix.name }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' || inputs.publish
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Natamux ${{ env.TAG }}
          body_path: docs/releases/${{ env.TAG }}.md
          files: artifacts/*

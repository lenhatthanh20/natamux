name: Rust cache

# Warm Cargo caches in the scope of main, the default branch. A branch restores caches of its own
# and of main, not of other branches, so a new natamux-ci/* snapshot branch, or one whose cache
# was evicted (10 GB per repo), built the Zed graph from scratch: 33 minutes for the macOS app
# (T-0158). main has no Rust code yet: the jobs build dev, with the keys rust.yml uses. A key that
# main already holds is only read, which keeps it from being evicted.
on:
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-cache
  cancel-in-progress: true

# As rust.yml, so the artifacts match.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # What the check job of rust.yml builds: clippy and the tests of the workspace.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
      - name: Make room on the disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install the GPUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libfontconfig-dev \
            libglib2.0-dev libssl-dev libva-dev libvulkan1 libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libzstd-dev libsqlite3-dev
      - run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-check-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-check-${{ runner.os }}-
      # A lint or a test that fails on dev must not stop the cache from being saved.
      - name: Build what the check job builds
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings || true
          cargo test --workspace --locked --no-run || true

  # What the app-macos job of rust.yml builds.
  app-macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
      - run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-app-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-app-${{ runner.os }}-
      - name: Build what the app-macos job builds
        run: |
          cargo build --release --locked -p natamux-app || true
          cargo build --release --locked -p natamux-cli || true

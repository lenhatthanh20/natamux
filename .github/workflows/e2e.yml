name: E2E

# Builds the production images, starts them with demo data (scripts/e2e.sh) and runs the
# Playwright tests in e2e/ against them, in groups side by side (e2e/groups.ts). On main it then
# publishes the images to ghcr.io, with build provenance, so scripts/e2e.sh can start them on any
# machine with Docker. See docs/e2e.md.
#
# Only the publish job can write packages, and it runs no package installs: a bad package in the
# test job cannot push images that other machines then run.
on:
  push:
    # natamux-ci/* holds snapshots that tasks push for a CI check (Check on CI).
    branches: [main, 'natamux-ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      daemon: ${{ steps.save.outputs.daemon }}
      web: ${{ steps.save.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the production images
        run: scripts/e2e.sh build

      # The publish job checks these ids, so an artifact replaced after this job is not pushed.
      - name: Save the images
        id: save
        run: |
          docker save natamux-daemon:local natamux-web:local | gzip > images.tar.gz
          for name in daemon web; do
            echo "$name=$(docker image inspect --format '{{.Id}}' "natamux-$name:local")" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: images
          path: images.tar.gz
          compression-level: 0
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    # Each group has its own daemon and demo data. A red group cancels the others.
    strategy:
      matrix:
        group: [timing, terminal, rest]
    # The slowest group takes about 4 minutes; a hang must fail the job, not hold it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: images

      - name: Start the images, with demo data
        env:
          E2E_LOCAL: "1"
        run: |
          gunzip -c images.tar.gz | docker load
          scripts/e2e.sh up

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # e2e/ is not part of the pnpm workspace, so the production images do not install it.
      # Its only dependency is pinned to an exact version.
      - name: Install Playwright
        working-directory: e2e
        run: |
          pnpm install --ignore-workspace --no-frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run the tests
        working-directory: e2e
        env:
          E2E_GROUP: ${{ matrix.group }}
        run: pnpm e2e

      # The terminal numbers of a green run too, so the next PRs can compare with them.
      # Only the timing group writes them (e2e/groups.ts).
      - name: Terminal measures
        if: always() && matrix.group == 'timing'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-measures
          path: e2e/test-results/terminal-measures.json
          if-no-files-found: ignore

      - name: Report, pictures and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.group }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

      - name: Logs on failure
        if: failure()
        run: scripts/e2e.sh logs

      - name: Stop
        if: always()
        run: scripts/e2e.sh down

  publish:
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: images

      - name: Load the images that the build job made
        env:
          DAEMON_ID: ${{ needs.build.outputs.daemon }}
          WEB_ID: ${{ needs.build.outputs.web }}
        run: |
          gunzip -c images.tar.gz | docker load
          test "$(docker image inspect --format '{{.Id}}' natamux-daemon:local)" = "$DAEMON_ID"
          test "$(docker image inspect --format '{{.Id}}' natamux-web:local)" = "$WEB_ID"

      - name: Publish the images
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGES: ghcr.io/${{ github.repository_owner }}/natamux
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for name in daemon web; do
            for tag in main "sha-${GITHUB_SHA::7}"; do
              docker tag "natamux-$name:local" "$IMAGES-$name:$tag"
              docker push --quiet "$IMAGES-$name:$tag"
            done
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGES-$name:main")"
            echo "$name=${digest#*@}" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/natamux-daemon
          subject-digest: ${{ steps.push.outputs.daemon }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/natamux-web
          subject-digest: ${{ steps.push.outputs.web }}

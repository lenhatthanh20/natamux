name: Make icons

# Temporary: makes the icon files for T-0046, since the local machine has no rsvg-convert.
# Remove after the generated files are committed.
on:
  push:
    branches: [natamux/t-0046-add-beautifull-icon-for-app]

permissions:
  contents: read

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
      - run: scripts/make-icons.sh
      - name: A second run gives the same files
        run: |
          git add -A
          scripts/make-icons.sh
          git diff --exit-code --stat
      - run: scripts/icons.test.sh
      - uses: actions/upload-artifact@v7
        with:
          name: icons
          path: |
            packages/desktop/build/icon.png
            packages/desktop/build/icon.icns
            packages/desktop/build/icon.ico
            packages/web/public/favicon.svg
            packages/web/public/apple-touch-icon.png
            site/public/icon.png
            site/public/icon.svg
            site/src/assets/icon.svg
          if-no-files-found: error

name: Perf

# The perf numbers of docs/perf.md: the app's flows, start and idle cost on macOS, the daemon's
# numbers on Linux, then scripts/perf-check.py against the targets and the baseline.
# Nightly on main, by hand, and on a push to natamux-ci/perf or natamux-ci/perf-*, so a snapshot
# can run it before this file is on main. Reads the main-scope caches of rust.yml, saves none.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: ['natamux-ci/perf', 'natamux-ci/perf-*']

permissions:
  contents: read

# bash -eo pipefail: a step that pipes into tee must fail with the command, not pass with tee.
defaults:
  run:
    shell: bash

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # The cache app-macos saves on main (rust.yml).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-app-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-app-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            rust-app-${{ runner.os }}-
      - run: python3 scripts/ci-changes.py mtimes
      - run: cargo build --release --locked -p natamux-app -p natamux-daemon -p natamux-cli
      - run: mkdir -p perf
      # Each run quits by itself; a run that hangs ends at the step's timeout.
      - name: Flows (5 runs)
        timeout-minutes: 20
        run: |
          for run in 1 2 3 4 5; do
            target/release/natamux-app --bench-flows --size 1280x800 | tee -a perf/flows.txt
          done
      # Where the frames of the resize go: the resize flow alone, 15 rounds (~30 s), under macOS
      # `sample`, into the perf-app artifact. perf-check.py does not read these files.
      # Process substitution keeps $! the app's pid, not tee's.
      - name: Profile of one flows run
        timeout-minutes: 10
        run: |
          target/release/natamux-app --bench-only resize --bench-repeat 15 --size 1280x800 > >(tee perf/resize-flows.txt) &
          pid=$!
          sleep 4
          sample "$pid" 30 1 -file perf/resize-sample.txt >/dev/null 2>&1 || echo "sample failed"
          wait "$pid" || true
      - name: Start times (5 runs)
        timeout-minutes: 10
        run: |
          for run in 1 2 3 4 5; do
            target/release/natamux-app --smoke | tee -a perf/smoke.txt
          done
      # The window must not wait for the login shell (T-0223 P4): 5 starts with a $SHELL whose rc
      # takes 3 s, as `slow_shell_first_frame_ms` and `slow_shell_first_data_ms` (the daemon serves
      # the task list before the login PATH is known). No data in the 5 s of --smoke counts as
      # 5000, so the gate fails. The pause outlasts the last start's shell and
      # daemon: while they still ran, a start took up to 3 times as long.
      - name: Start with a slow login shell
        run: |
          shell="$RUNNER_TEMP/slow-shell"
          printf '#!/bin/sh\nsleep 3\nexec /bin/zsh "$@"\n' >"$shell"
          chmod +x "$shell"
          for run in 1 2 3 4 5; do
            sleep 6
            SHELL="$shell" target/release/natamux-app --smoke |
              sed -n \
                -e 's/^smoke: first_frame_ms=\([0-9.]*\) first_data_ms=\([0-9.]*\).*/slow_shell: slow_shell_first_frame_ms=\1 slow_shell_first_data_ms=\2/p' \
                -e t \
                -e 's/^smoke: first_frame_ms=\([0-9.]*\).*/slow_shell: slow_shell_first_frame_ms=\1 slow_shell_first_data_ms=5000/p' |
              tee -a perf/slow-shell.txt
          done
      - name: Idle cost and a background profile
        timeout-minutes: 10
        env:
          PROFILE: "1"
          PROFILE_FILE: perf/motion-sample.txt
        run: scripts/motion-cost.sh | tee perf/motion.txt
      - name: Keep the perf reports
        if: always()
        run: cp ~/Library/Logs/Natamux/perf-*.json perf/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-app
          path: perf/
          if-no-files-found: ignore

  daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test --release --locked -p natamux-daemon --test daemon_bench --no-run
      - run: mkdir -p perf
      - name: Daemon bench
        env:
          NATAMUX_BENCH: "1"
          NATAMUX_BENCH_JSON: ${{ github.workspace }}/perf/daemon.json
        run: cargo test --release --locked -p natamux-daemon --test daemon_bench -- --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-daemon
          path: perf/
          if-no-files-found: ignore

  check:
    needs: [app, daemon]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/perf-check.test.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perf-*
          path: perf
      - name: Check the numbers
        run: |
          shopt -s nullglob
          python3 scripts/perf-check.py --medians perf-medians.json \
            perf/*/flows.txt perf/*/smoke.txt perf/*/slow-shell.txt perf/*/motion.txt \
            perf/*/daemon.json |
            tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-medians
          path: perf-medians.json
          if-no-files-found: ignore

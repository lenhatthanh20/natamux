name: Rust

# Checks of the Cargo workspace. Rust builds run here, not on the owner's Mac
# (docs/plan-rust-migration.md, "Safe local setup").
on:
  push:
    # natamux-ci/* holds snapshots that tasks push for a CI check (Check on CI). Rust tasks share
    # natamux-ci/rust (every job) and natamux-ci/rust-check (check only); daemon tasks share
    # natamux-ci/daemon and natamux-ci/daemon-check. Their caches stay warm.
    # A snapshot runs only the jobs and contract suites its files need (the changes job; a
    # [contract: hooks] tag in the commit message picks suites). PRs into dev and dev run all.
    branches: [dev, 'natamux-ci/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  # Debug info of the Zed graph fills the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # What the change touches decides which jobs and contract suites run (scripts/ci-changes.py).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      daemon: ${{ steps.flags.outputs.daemon }}
      terminal: ${{ steps.flags.outputs.terminal }}
      app: ${{ steps.flags.outputs.app }}
      client: ${{ steps.flags.outputs.client }}
      lock: ${{ steps.flags.outputs.lock }}
      contract: ${{ steps.flags.outputs.contract }}
      crates: ${{ steps.flags.outputs.crates }}
      daemon_crates: ${{ steps.flags.outputs.daemon_crates }}
      suites: ${{ steps.flags.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: git rev-parse --verify -q origin/dev || git fetch origin dev
      - id: flags
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: python3 scripts/ci-changes.py flags

  # fmt, clippy, tests, the layer rule and the colour-literal rule.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # In the background: it takes 1 to 2 minutes, and the next steps need no room yet. The
      # runner keeps the process across steps; "Wait for the room" waits for it before cargo.
      - name: Make room on the disk
        if: ${{ !startsWith(github.ref, 'refs/heads/natamux-ci/daemon') }}
        run: |
          nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL > "$RUNNER_TEMP/room.log" 2>&1 &
      # The system libraries GPUI builds against on Linux, from Zed's script/linux.
      - name: Install the GPUI libraries
        if: ${{ !startsWith(github.ref, 'refs/heads/natamux-ci/daemon') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libfontconfig-dev \
            libglib2.0-dev libssl-dev libva-dev libvulkan1 libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libzstd-dev libsqlite3-dev
      # Installs the version that rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-check-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-check-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            rust-check-${{ runner.os }}-
      - name: Wait for the room
        if: ${{ !startsWith(github.ref, 'refs/heads/natamux-ci/daemon') }}
        run: while pgrep -f "rm -rf /usr/local/lib/android" > /dev/null; do sleep 2; done
      - run: python3 scripts/ci-changes.py mtimes
      # Code is never built on the owner's Mac, so a snapshot is formatted here: one run still
      # shows clippy and the tests, the patch comes back as an artifact, and the job fails at its end.
      - name: Format a snapshot
        id: fmt
        if: ${{ startsWith(github.ref, 'refs/heads/natamux-ci/') }}
        run: |
          cargo fmt --all
          git diff > "$RUNNER_TEMP/fmt.patch"
          if [ -s "$RUNNER_TEMP/fmt.patch" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.fmt.outputs.changed == 'true'
        with:
          name: fmt-patch
          path: ${{ runner.temp }}/fmt.patch
      - id: build
        run: cargo xtask ci${{ startsWith(github.ref, 'refs/heads/natamux-ci/daemon') && ' --no-app' || '' }}${{ startsWith(github.ref, 'refs/heads/natamux-ci/') && ' --all-errors' || '' }}
      - run: python3 scripts/ci-changes.test.py
      - run: bash scripts/fake-gh.test.sh
      - run: python3 scripts/check-shots.test.py
      - run: python3 scripts/compare-shots.test.py
      - name: Fail when the snapshot needed formatting
        if: steps.fmt.outputs.changed == 'true'
        run: |
          echo "cargo fmt changed files: apply the fmt-patch artifact (git apply)."
          exit 1
      - name: Stamp the cache with this commit
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        run: python3 scripts/ci-changes.py stamp
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-check-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
      - name: Keep only the newest cache of this job
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref "$GITHUB_REF" --key "rust-check-${{ runner.os }}-" --json id,key,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[1:] | .[].id' |
            while read -r id; do gh cache delete "$id"; done

  # The app for the owner to run (phase 1): built, checked, attested. Also answers whether GPUI
  # draws on the macOS runner, from the screenshots.
  app-macos:
    needs: changes
    # A -check branch is the compile loop: only the check job runs there. Daemon snapshots do not
    # touch the app, and a Rust snapshot builds it only when the app changed.
    if: ${{ !endsWith(github.ref, '-check') && github.ref != 'refs/heads/natamux-ci/daemon' && (needs.changes.outputs.app == 'true' || !startsWith(github.ref, 'refs/heads/natamux-ci/rust')) }}
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
      id-token: write
      attestations: write
    # The owner signed the baselines off (docs/rust-phase3.md): a differing shot fails the job.
    # REPORT_ONLY: "1" is for a change of the look before its new baselines: the compare step is
    # skipped then (everything differs; the shots are in the artifact). T-0158 (lean layout) sets
    # it until the owner signs its shots off.
    env:
      REPORT_ONLY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-app-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-app-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            rust-app-${{ runner.os }}-
      - run: python3 scripts/ci-changes.py mtimes
      - id: build
        run: cargo build --release --locked -p natamux-app
      - name: Smoke test
        run: target/release/natamux-app --smoke
      - name: Smoke test, terminal grid and pipeline chart
        run: target/release/natamux-app --smoke --fake-daemon
      # CPU and draws of an idle window, with focus and in the background (docs/rust-phase3.md
      # "Motion"). Only a snapshot push whose commit message has a line "Measure: motion".
      - name: Motion cost
        if: "github.event_name == 'push' && contains(github.event.head_commit.message, 'Measure: motion')"
        run: scripts/motion-cost.sh
      - name: Screenshots
        run: |
          mkdir -p shots
          for size in 800x560 1000x680; do
            for theme in dark light; do
              target/release/natamux-app --fake-daemon --theme "$theme" --size "$size" --hold 15 &
              sleep 10
              screencapture -x "shots/window-$theme-$size.png"
              wait
              sips -s format bmp "shots/window-$theme-$size.png" --out "shots/window-$theme-$size.bmp" >/dev/null
            done
          done
      # Screens 1 to 7 of phase 3: every state in both themes at two sizes, and the DOCKED ones at
      # 1024x720 too, where the sidebar docks; the runner's screen is 1024x768, so the details panel,
      # which docks from 1280, is shot as a sheet (docs/rust-phase3.md).
      # The shot is the app's window itself, found by its process id: macOS moves a window that
      # asks for the top of the screen below the menu bar, so a fixed screen rectangle is wrong.
      - name: Screen shots
        env:
          # A snapshot push may shoot only some states: a line "Shots: <state> ..." in its commit
          # message (T-0158: about 1 minute instead of 22). A PR and dev shoot every state.
          MESSAGE: ${{ github.event_name == 'push' && github.event.head_commit.message || '' }}
          STATES: >-
            tasks-table tasks-board board-hover-card add-task-dialog start-task remove-workspace
            clear-finished add-subtask task-context-menu skeleton toast empty filter-miss
            no-projects load-error drawer workspace-terminal-running terminal-find
            workspace-terminal-needs-input workspace-terminal-review no-workspace
            workspace-preparing finished-wrap-up agents-grid task-details-review
            task-details-needs-input answer-banner workspace-terminal-plan-gate workspace-progress
            stage-failed send-back details-details compare-tries details-more-menu fan-out
            workspace-changes-empty workspace-changes-list workspace-changes-diff
            workspace-changes-ask rollback image-diff workspace-history tasks-progress
            project-settings-tab-stages project-settings-agent-stage project-settings-stage-picker
            project-settings-branch project-settings-problems project-settings-conflict
            details-files workspace-docs workspace-docs-edit workspace-editor
            workspace-editor-source workspace-editor-draft workspace-editor-conflict
            terminal-drop-target
            palette palette-query palette-no-match palette-jump shortcuts account-menu
            terminal-font settings-dialog projects project-settings project-settings-tab-issues
            project-settings-tab-json project-settings-json-error import-issues sign-in
            sign-in-error add-menu details-empty
          DOCKED: >-
            tasks-table workspace-terminal-running terminal-find workspace-terminal-needs-input
            workspace-terminal-review no-workspace workspace-preparing finished-wrap-up agents-grid
            task-details-review task-details-needs-input answer-banner workspace-terminal-plan-gate
            workspace-progress stage-failed send-back details-details compare-tries
            details-more-menu fan-out workspace-changes-empty workspace-changes-list workspace-changes-diff
            workspace-changes-ask rollback image-diff workspace-history tasks-progress
            project-settings-tab-stages project-settings-agent-stage project-settings-stage-picker
            project-settings-branch project-settings-problems project-settings-conflict
            details-files workspace-docs workspace-docs-edit workspace-editor
            workspace-editor-source workspace-editor-draft workspace-editor-conflict
            terminal-drop-target
            palette palette-query palette-no-match palette-jump shortcuts account-menu
            terminal-font settings-dialog projects project-settings project-settings-tab-issues
            project-settings-tab-json project-settings-json-error import-issues sign-in
            sign-in-error add-menu details-empty
        run: |
          mkdir -p shots
          only=$(printf '%s\n' "$MESSAGE" | sed -n 's/^Shots: *//p' | head -n 1)
          if [ -n "$only" ] && [ "$GITHUB_REF" != refs/heads/dev ]; then
            for state in $only; do
              case " $STATES " in
                *" $state "*) ;;
                *) echo "::error::Shots: no state $state"; exit 1 ;;
              esac
            done
            STATES=$only
            echo "Shot only: $only" >> "$GITHUB_STEP_SUMMARY"
          fi
          window_of() {
            osascript -l JavaScript -e "ObjC.import('CoreGraphics');
              const all = ObjC.deepUnwrap(ObjC.castRefToObject(\$.CGWindowListCopyWindowInfo(1, 0)));
              const own = all.filter(w => w.kCGWindowOwnerPID === $1 && w.kCGWindowLayer === 0);
              own.length ? String(own[0].kCGWindowNumber) : ''"
          }
          for state in $STATES; do
            sizes="1000x680 800x560"
            case " $DOCKED " in *" $state "*) sizes="$sizes 1024x720" ;; esac
            for size in $sizes; do
              for theme in light dark; do
                name="$state-$theme-$size"
                target/release/natamux-app --shot "$state" --fake-daemon --theme "$theme" --size "$size" --hold 30 &
                pid=$!
                sleep 3
                id=$(window_of "$pid")
                if [ -z "$id" ]; then
                  echo "::error::no window of the app for $name"
                  exit 1
                fi
                screencapture -x -o -l "$id" "shots/$name.png"
                # Done with this state: no need to sit out --hold.
                kill "$pid"
                wait "$pid" || true
              done
            done
          done
      - name: Compare shots with the baselines
        if: env.REPORT_ONLY == ''
        run: |
          mkdir -p "$RUNNER_TEMP/baselines"
          failed=0
          printf '| shot | result |\n|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          for shot in shots/*-*-*x*.png; do
            name=$(basename "$shot" .png)
            case "$name" in window-*) continue ;; esac
            baseline="crates/natamux-app/tests/shots/$name.png"
            if [ ! -f "$baseline" ]; then
              echo "| $name | no baseline yet |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            sips -s format bmp "$shot" --out "$RUNNER_TEMP/shot.bmp" >/dev/null
            sips -s format bmp "$baseline" --out "$RUNNER_TEMP/baselines/$name.bmp" >/dev/null
            # The script writes no diff when the sizes differ; an old one must not pass for this shot.
            rm -f "$RUNNER_TEMP/diff.bmp"
            if python3 scripts/compare-shots.py "$RUNNER_TEMP/shot.bmp" \
              "$RUNNER_TEMP/baselines/$name.bmp" "$RUNNER_TEMP/diff.bmp"; then
              result=matches
            else
              result=DIFFERS
              failed=1
            fi
            if [ -f "$RUNNER_TEMP/diff.bmp" ]; then
              sips -s format png "$RUNNER_TEMP/diff.bmp" --out "shots/diff-$name.png" >/dev/null
            fi
            echo "| $name | $result |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"
      - name: Did GPUI draw
        run: |
          for size in 800x560 1000x680; do
            if python3 scripts/check-shots.py "shots/window-dark-$size.bmp" "shots/window-light-$size.bmp"; then
              echo "GPUI drew the window on the macOS runner ($size)." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "GPUI did not draw the window on the macOS runner ($size)." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: shots-macos
          path: shots/*.png
          if-no-files-found: ignore
      - run: scripts/bundle-rust-app.sh dist
      - name: The zipped app is at most 60 MB
        run: |
          size=$(stat -f %z dist/natamux-app-macos-arm64.zip)
          echo "natamux-app-macos-arm64.zip: $size bytes" >> "$GITHUB_STEP_SUMMARY"
          [ "$size" -le $((60 * 1024 * 1024)) ]
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/natamux-app-macos-arm64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: natamux-app-macos-arm64
          path: dist/natamux-app-macos-arm64.zip
          compression-level: 0
      # Phase 2: the Rust `natamux` and `nmx` (docs/rust-phase2.md).
      - run: cargo build --release --locked -p natamux-cli
      - run: tar -czf dist/natamux-cli-macos-arm64.tar.gz -C target/release natamux nmx
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/natamux-cli-macos-arm64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: natamux-cli-macos-arm64
          path: dist/natamux-cli-macos-arm64.tar.gz
          compression-level: 0
      - name: Stamp the cache with this commit
        if: always() && steps.build.outcome == 'success'
        run: python3 scripts/ci-changes.py stamp
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.build.outcome == 'success'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-app-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
      - name: Keep only the newest cache of this job
        if: always() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref "$GITHUB_REF" --key "rust-app-${{ runner.os }}-" --json id,key,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[1:] | .[].id' |
            while read -r id; do gh cache delete "$id"; done

  # Gate 4 of phase 1: a Windows build starts and types.
  app-windows:
    # The slowest job: snapshot pushes skip it, PRs into dev and dev itself run it (gate 4).
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-app-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-app-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            rust-app-${{ runner.os }}-
      - run: python scripts/ci-changes.py mtimes
      - id: build
        run: cargo build --release --locked -p natamux-app
      - name: Smoke test
        run: target/release/natamux-app.exe --smoke
      - name: Screenshots
        run: |
          mkdir -p shots
          for theme in dark light; do
            target/release/natamux-app.exe --fake-daemon --theme "$theme" --size 1280x800 --hold 15 &
            sleep 10
            powershell -NoProfile -Command "
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              \$b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              \$bmp = New-Object System.Drawing.Bitmap \$b.Width, \$b.Height
              [System.Drawing.Graphics]::FromImage(\$bmp).CopyFromScreen(\$b.Location, [System.Drawing.Point]::Empty, \$b.Size)
              \$bmp.Save('shots/window-$theme.bmp', [System.Drawing.Imaging.ImageFormat]::Bmp)"
            wait
          done
          python scripts/check-shots.py shots/window-dark.bmp shots/window-light.bmp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: shots-windows
          path: shots/*.bmp
          if-no-files-found: ignore
      # Phase 2: the Rust `natamux` and `nmx` (docs/rust-phase2.md).
      - run: cargo build --release --locked -p natamux-cli
      - run: |
          mkdir -p dist
          powershell -NoProfile -Command "Compress-Archive -Path target/release/natamux.exe, target/release/nmx.exe -DestinationPath dist/natamux-cli-windows-x64.zip"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/natamux-cli-windows-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: natamux-cli-windows-x64
          path: dist/natamux-cli-windows-x64.zip
          compression-level: 0
      - name: Stamp the cache with this commit
        if: always() && steps.build.outcome == 'success'
        run: python scripts/ci-changes.py stamp
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.build.outcome == 'success'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-app-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
      - name: Keep only the newest cache of this job
        if: always() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref "$GITHUB_REF" --key "rust-app-${{ runner.os }}-" --json id,key,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[1:] | .[].id' |
            while read -r id; do gh cache delete "$id"; done

  # natamux-client against the real daemon: the checked images of main, as scripts/e2e.sh starts them.
  # `--ignored` runs every ignored test of live_daemon.rs, live_daemon_git.rs,
  # live_daemon_settings.rs, live_daemon_files.rs and live_daemon_projects.rs: the terminal test, the live list, and the
  # flows of phase 3: screen 1 (create, rename, subtask, workspace, preparing, remove, delete),
  # screen 2, screen 3, and screen 4
  # (changes, graph, and the refused commit, commit message, undo, file diff, image and agent
  # message).
  # Screen 5 (live_daemon_settings.rs): read the settings and the skills of the default project; save
  # them with the version (a new version comes back); save with the old version (409); save a pipeline
  # that breaks the rules (400); put the first file back with the current version.
  # Screen 6 (live_daemon_files.rs): read the tree and a file, save it with its version, save with
  # the old version (409), a path outside the worktree (409), write and read a stage file, list the
  # attachments.
  # Screen 7 (live_daemon_projects.rs): a wrong token (401) and the right one, the projects, adding a
  # relative path and a project added already (400), the GitHub issues and their import (409 without
  # `gh`), an Issues-tab setting saved and put back.
  live-daemon:
    needs: changes
    if: ${{ !endsWith(github.ref, '-check') && needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      NATAMUX_URL: http://127.0.0.1:8080/api
      NATAMUX_TOKEN: e2e-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-live-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-live-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            rust-live-${{ runner.os }}-
      - run: python3 scripts/ci-changes.py mtimes
      - id: build
        run: cargo test --locked -p natamux-client --test live_daemon --test live_daemon_git --test live_daemon_settings --test live_daemon_files --test live_daemon_projects --no-run
      - name: Start the daemon and the dashboard of main
        run: scripts/e2e.sh up
      # As makeShellTask in e2e/tests/terminal-helpers.ts: a task past its agent, with a workspace.
      - name: Make a task with a workspace
        id: task
        run: |
          api() { curl -fsS -H "authorization: Bearer $NATAMUX_TOKEN" -H 'content-type: application/json' "$@"; }
          repo=$(api "$NATAMUX_URL/repos" | jq -r '.repos[0].id')
          id=$(api -X POST "$NATAMUX_URL/tasks" -d "{\"title\":\"Rust client live test\",\"repo\":\"$repo\"}" | jq -r .task.id)
          for _ in $(seq 60); do
            state=$(api "$NATAMUX_URL/tasks/$id" | jq -r .task.state)
            [ "$state" = ready ] || [ "$state" = review ] && break
            sleep 0.5
          done
          api -X POST "$NATAMUX_URL/tasks/$id/events" \
            -d '{"source":"human","type":"state.overridden","payload":{"to":"review","stage":"context"}}' >/dev/null
          api -X POST "$NATAMUX_URL/tasks/$id/workspace" -d '{}' >/dev/null
          for _ in $(seq 60); do
            [ "$(api "$NATAMUX_URL/tasks/$id" | jq -r .task.workspace)" != null ] && break
            sleep 0.5
          done
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - run: cargo test --locked -p natamux-client --test live_daemon --test live_daemon_git --test live_daemon_settings --test live_daemon_files --test live_daemon_projects -- --ignored
        env:
          NATAMUX_LIVE_TASK: ${{ steps.task.outputs.id }}
      - if: failure()
        run: scripts/e2e.sh logs
      - name: Stamp the cache with this commit
        if: always() && steps.build.outcome == 'success'
        run: python3 scripts/ci-changes.py stamp
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.build.outcome == 'success'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-live-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
      - name: Keep only the newest cache of this job
        if: always() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref "$GITHUB_REF" --key "rust-live-${{ runner.os }}-" --json id,key,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[1:] | .[].id' |
            while read -r id; do gh cache delete "$id"; done

  # Phase 2: the Rust `natamux` against the daemon of main. Its output must equal the TypeScript
  # command's (scripts/cli-parity.sh), and the agent hook specs run with it first on the agents'
  # PATH (compose.rust-cli.yaml). Then the Linux build, attested. See docs/rust-phase2.md.
  cli:
    needs: changes
    if: ${{ !endsWith(github.ref, '-check') && needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      NATAMUX_URL: http://127.0.0.1:8080/api
      NATAMUX_TOKEN: e2e-token
      E2E_EXTRA_COMPOSE: compose.rust-cli.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A static build runs in the Debian image of the daemon, whatever its glibc.
      - run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-cli-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-cli-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            rust-cli-${{ runner.os }}-
      - run: python3 scripts/ci-changes.py mtimes
      - id: build
        run: cargo build --release --locked -p natamux-cli --target x86_64-unknown-linux-musl
      - name: Start the daemon and the dashboard of main, with the Rust CLI on the agents' PATH
        run: scripts/e2e.sh up
      - name: The agents' PATH finds the Rust CLI
        run: |
          docker compose -p natamux-e2e -f compose.prod.yaml -f compose.e2e.yaml -f "$E2E_EXTRA_COMPOSE" \
            exec -T daemon sh -c 'PATH="$NATAMUX_BIN_DIR:$PATH"; command -v natamux; natamux help | head -n 1'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the TypeScript CLI
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          pnpm install --frozen-lockfile --filter "@natamux/cli..."
          pnpm --filter @natamux/core --filter @natamux/cli build
      - name: Same output as the TypeScript CLI
        run: scripts/cli-parity.sh packages/cli/dist/main.js target/x86_64-unknown-linux-musl/release/natamux
      # e2e/ is not part of the pnpm workspace; its only dependency is pinned to an exact version.
      - name: Install Playwright
        working-directory: e2e
        run: |
          pnpm install --ignore-workspace --no-frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Agent hook specs with the Rust CLI
        working-directory: e2e
        run: pnpm e2e needs-input.spec.ts shell-agent.spec.ts ask-agent.spec.ts --project=desktop
      - name: Report, pictures and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: scripts/e2e.sh logs
      - name: Stop
        if: always()
        run: scripts/e2e.sh down
      - run: |
          mkdir -p dist
          tar -czf dist/natamux-cli-linux-x64.tar.gz -C target/x86_64-unknown-linux-musl/release natamux nmx
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/natamux-cli-linux-x64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: natamux-cli-linux-x64
          path: dist/natamux-cli-linux-x64.tar.gz
          compression-level: 0
      - name: Stamp the cache with this commit
        if: always() && steps.build.outcome == 'success'
        run: python3 scripts/ci-changes.py stamp
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.build.outcome == 'success'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-cli-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
      - name: Keep only the newest cache of this job
        if: always() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref "$GITHUB_REF" --key "rust-cli-${{ runner.os }}-" --json id,key,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[1:] | .[].id' |
            while read -r id; do gh cache delete "$id"; done

  # Phase 4, part 1: the daemon's terminal crates on macOS and on Windows (ConPTY). Linux runs them
  # in `check`. Not on the snapshots of phase 3 (docs/rust-phase4.md).
  daemon-os:
    needs: changes
    if: ${{ !endsWith(github.ref, '-check') && github.ref != 'refs/heads/natamux-ci/rust' && needs.changes.outputs.daemon_crates != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            py: python3
          - os: windows-latest
            py: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-daemon-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-daemon-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            rust-daemon-${{ runner.os }}-
      - run: ${{ matrix.py }} scripts/ci-changes.py mtimes
      - id: build
        run: cargo test --locked ${{ needs.changes.outputs.daemon_crates }} --no-run
      - run: cargo test --locked ${{ needs.changes.outputs.daemon_crates }}
      - name: Stamp the cache with this commit
        if: always() && steps.build.outcome == 'success'
        run: ${{ matrix.py }} scripts/ci-changes.py stamp
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.build.outcome == 'success'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-daemon-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
      - name: Keep only the newest cache of this job
        if: always() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref "$GITHUB_REF" --key "rust-daemon-${{ runner.os }}-" --json id,key,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[1:] | .[].id' |
            while read -r id; do gh cache delete "$id"; done

  # Phase 4, part 1: the contract suite. The Node daemon of main and the Rust daemon run side by
  # side from the same image (compose.rust-daemon.yaml); the terminal scenarios of
  # crates/natamux-contract run on both and compare the answers, then xterm.js replays the
  # snapshots of both (scripts/xterm-grid.mjs).
  daemon-contract:
    needs: changes
    if: ${{ !endsWith(github.ref, '-check') && github.ref != 'refs/heads/natamux-ci/rust' && needs.changes.outputs.contract == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      NATAMUX_TOKEN: e2e-token
      NATAMUX_REPO: e2e-repo
      E2E_EXTRA_COMPOSE: compose.rust-daemon.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A static build runs in the Debian image of the daemon, whatever its glibc.
      - run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-daemon-contract-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-daemon-contract-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            rust-daemon-contract-${{ runner.os }}-
      - run: python3 scripts/ci-changes.py mtimes
      # The bundled SQLite of rusqlite is C: musl-gcc builds it for the static binary.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build --release --locked -p natamux-daemon --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
      - id: build
        run: cargo test --locked -p natamux-contract --tests --no-run
      - name: Start the Node daemon of main and the Rust daemon beside it
        run: |
          scripts/e2e.sh up
          # e2e.sh starts daemon and web only; the Rust one runs from the image e2e.sh checked.
          image=$(docker inspect -f '{{.Config.Image}}' natamux-e2e-daemon-1)
          echo "NATAMUX_DAEMON_IMAGE=$image" >> "$GITHUB_ENV"
          NATAMUX_DAEMON_IMAGE="$image" docker compose -p natamux-e2e -f compose.prod.yaml \
            -f compose.e2e.yaml -f compose.rust-daemon.yaml up -d --no-build daemon-rust
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:4318/health && exit 0
            sleep 0.5
          done
          docker logs natamux-e2e-daemon-rust-1
          exit 1
      # As makeShellTask in e2e/tests/terminal-helpers.ts: a task past its agent, with a workspace.
      - name: Make a task with a workspace
        id: task
        env:
          NATAMUX_URL: http://127.0.0.1:8080/api
        run: |
          api() { curl -fsS -H "authorization: Bearer $NATAMUX_TOKEN" -H 'content-type: application/json' "$@"; }
          repo=$(api "$NATAMUX_URL/repos" | jq -r '.repos[0].id')
          id=$(api -X POST "$NATAMUX_URL/tasks" -d "{\"title\":\"Daemon contract\",\"repo\":\"$repo\"}" | jq -r .task.id)
          for _ in $(seq 60); do
            state=$(api "$NATAMUX_URL/tasks/$id" | jq -r .task.state)
            [ "$state" = ready ] || [ "$state" = review ] && break
            sleep 0.5
          done
          api -X POST "$NATAMUX_URL/tasks/$id/events" \
            -d '{"source":"human","type":"state.overridden","payload":{"to":"review","stage":"context"}}' >/dev/null
          api -X POST "$NATAMUX_URL/tasks/$id/workspace" -d '{}' >/dev/null
          for _ in $(seq 60); do
            [ "$(api "$NATAMUX_URL/tasks/$id" | jq -r .task.workspace)" != null ] && break
            sleep 0.5
          done
          api "$NATAMUX_URL/tasks/$id" | jq -r .task.workspace
          echo "id=$id" >> "$GITHUB_OUTPUT"
      # Part 2: the Rust daemon reads the same project and the part-1 task, from files Node wrote.
      # The contract pipeline has only stages that wait for a person, so Node's stage runner starts
      # nothing and both daemons see only the events the scenarios send.
      - name: Give the Rust daemon the project, the task and the contract settings
        env:
          TASK: ${{ steps.task.outputs.id }}
        run: |
          compose() { docker compose -p natamux-e2e -f compose.prod.yaml -f compose.e2e.yaml -f compose.rust-daemon.yaml "$@"; }
          compose exec -T daemon sh -c "mkdir -p /data/rust/tasks && cp /data/repos.json /data/rust/ && cp /data/tasks/$TASK.md /data/tasks/$TASK.events.jsonl /data/rust/tasks/"
          compose exec -T daemon sh -c 'cat > /repo/.natamux.json' < crates/natamux-contract/tests/fixtures/natamux.json
          compose restart daemon-rust
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:4318/health && exit 0
            sleep 0.5
          done
          exit 1
      # Part 3: a second project for the stage scenarios, with the pipeline of
      # crates/natamux-contract/tests/fixtures/stages.natamux.json, known to both daemons.
      - name: Give both daemons the stages project
        env:
          NATAMUX_URL: http://127.0.0.1:8080/api
        run: |
          compose() { docker compose -p natamux-e2e -f compose.prod.yaml -f compose.e2e.yaml -f compose.rust-daemon.yaml "$@"; }
          api() { curl -fsS -H "authorization: Bearer $NATAMUX_TOKEN" -H 'content-type: application/json' "$@"; }
          compose exec -T daemon sh -c 'set -e; mkdir -p /data/stages-repo; cd /data/stages-repo
            git init -q -b main; git config user.name "Natamux e2e"; git config user.email e2e@example.invalid
            printf "# Stages\n" > README.md; git add README.md; git commit -q -m "Start the stages repository"'
          compose exec -T daemon sh -c 'cat > /data/stages-repo/.natamux.json' < crates/natamux-contract/tests/fixtures/stages.natamux.json
          repo=$(api -X POST "$NATAMUX_URL/repos" -d '{"path":"/data/stages-repo","name":"stages-repo"}' | jq -r .repo.id)
          echo "NATAMUX_CONTRACT_STAGES_REPO=$repo" >> "$GITHUB_ENV"
          # A pipeline with an error falls back to the defaults on both daemons: fail early.
          api "$NATAMUX_URL/repos/$repo/settings" | jq -e '.error == null'
          # The workspaces project: a bare origin to push to, and the fake gh state folders.
          compose exec -T daemon sh -c 'set -e; mkdir -p /data/workspaces-repo /data/fake-gh/node /data/fake-gh/rust
            git init -q --bare -b main /data/workspaces-origin.git
            cd /data/workspaces-repo
            git init -q -b main; git config user.name "Natamux e2e"; git config user.email e2e@example.invalid
            printf "# Workspaces\n" > README.md; echo "echo ok > setup-ran.txt" > .natamux-setup'
          compose exec -T daemon sh -c 'cat > /data/workspaces-repo/.natamux.json' < crates/natamux-contract/tests/fixtures/workspaces.natamux.json
          compose exec -T daemon sh -c 'set -e; cd /data/workspaces-repo
            git add README.md .natamux-setup .natamux.json; git commit -q -m "Start the workspaces repository"
            git remote add origin /data/workspaces-origin.git; git push -q -u origin main'
          wrepo=$(api -X POST "$NATAMUX_URL/repos" -d '{"path":"/data/workspaces-repo","name":"workspaces-repo"}' | jq -r .repo.id)
          echo "NATAMUX_CONTRACT_WORKSPACES_REPO=$wrepo" >> "$GITHUB_ENV"
          api "$NATAMUX_URL/repos/$wrepo/settings" | jq -e '.error == null'
          compose exec -T daemon sh -c 'cp /data/repos.json /data/rust/repos.json'
          compose restart daemon-rust
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:4318/health && exit 0
            sleep 0.5
          done
          exit 1
      - name: The terminal scenarios on both daemons
        env:
          NATAMUX_CONTRACT_NODE: http://127.0.0.1:8080/api
          NATAMUX_CONTRACT_RUST: http://127.0.0.1:4318
          NATAMUX_CONTRACT_TOKEN: e2e-token
          NATAMUX_CONTRACT_TASK: ${{ steps.task.outputs.id }}
          NATAMUX_CONTRACT_NODE_RESTART: >-
            cd "$GITHUB_WORKSPACE" && docker compose -p natamux-e2e -f compose.prod.yaml -f compose.e2e.yaml
            -f compose.rust-daemon.yaml restart daemon
          NATAMUX_CONTRACT_RUST_RESTART: >-
            cd "$GITHUB_WORKSPACE" && docker compose -p natamux-e2e -f compose.prod.yaml -f compose.e2e.yaml
            -f compose.rust-daemon.yaml restart daemon-rust
          NATAMUX_CONTRACT_DUMPS: ${{ runner.temp }}/dumps
          NATAMUX_CONTRACT_REPORT: ${{ runner.temp }}/contract.md
          # Both daemons share the data volume; one container reads and copies the files of both.
          NATAMUX_CONTRACT_EXEC: >-
            docker compose -p natamux-e2e -f compose.prod.yaml -f compose.e2e.yaml
            -f compose.rust-daemon.yaml exec -T daemon
          NATAMUX_CONTRACT_RUST_EXEC: >-
            docker compose -p natamux-e2e -f compose.prod.yaml -f compose.e2e.yaml
            -f compose.rust-daemon.yaml exec -T daemon-rust
          NATAMUX_CONTRACT_NODE_DATA: /data
          NATAMUX_CONTRACT_RUST_DATA: /data/rust
          SUITES: ${{ needs.changes.outputs.suites }}
        run: |
          printf '| scenario | step | result |\n|---|---|---|\n' > "$NATAMUX_CONTRACT_REPORT"
          status=0
          for suite in ${SUITES//,/ }; do
            case "$suite" in
              terminals) cargo test --locked -p natamux-contract --test terminals -- --ignored --test-threads=1 || status=$? ;;
              tasks) cargo test --locked -p natamux-contract --test tasks -- --ignored --test-threads=1 || status=$? ;;
              stages) cargo test --locked -p natamux-contract --test stages -- --ignored --test-threads=1 --skip hooks:: --skip workspaces:: || status=$? ;;
              hooks) cargo test --locked -p natamux-contract --test stages -- --ignored --test-threads=1 hooks:: || status=$? ;;
              workspaces) cargo test --locked -p natamux-contract --test stages -- --ignored --test-threads=1 workspaces:: || status=$? ;;
            esac
          done
          tee -a "$GITHUB_STEP_SUMMARY" < "$NATAMUX_CONTRACT_REPORT"
          exit "$status"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ always() && (contains(needs.changes.outputs.suites, 'terminals') || contains(needs.changes.outputs.suites, 'tasks')) }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ always() && (contains(needs.changes.outputs.suites, 'terminals') || contains(needs.changes.outputs.suites, 'tasks')) }}
        with:
          node-version: 22
      - name: Replay the snapshots of both daemons in xterm.js
        if: ${{ always() && contains(needs.changes.outputs.suites, 'terminals') }}
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          pnpm install --frozen-lockfile --filter "@natamux/daemon"
          node scripts/xterm-grid.mjs "$RUNNER_TEMP/dumps"
      # gray-matter and js-yaml of the Node daemon write the fixtures the Rust store is held to.
      - name: The task file fixtures equal gray-matter's output
        if: ${{ always() && contains(needs.changes.outputs.suites, 'tasks') }}
        run: |
          node scripts/task-file-golden.mjs crates/natamux-store/tests/fixtures/front_matter
          git status --porcelain crates/natamux-store/tests/fixtures
          test -z "$(git status --porcelain crates/natamux-store/tests/fixtures)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: contract-dumps
          path: |
            ${{ runner.temp }}/dumps
            crates/natamux-store/tests/fixtures
          if-no-files-found: ignore
      - if: failure()
        run: scripts/e2e.sh logs
      - if: always()
        run: scripts/e2e.sh down
      - name: Stamp the cache with this commit
        if: always() && steps.build.outcome == 'success'
        run: python3 scripts/ci-changes.py stamp
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.build.outcome == 'success'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-daemon-contract-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
      - name: Keep only the newest cache of this job
        if: always() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref "$GITHUB_REF" --key "rust-daemon-contract-${{ runner.os }}-" --json id,key,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[1:] | .[].id' |
            while read -r id; do gh cache delete "$id"; done

  # Phase 4, part 1: the terminal bench of the Node daemon and of the Rust one, on the same runner.
  # The gate: a snapshot as fast as Node's, parsing at least as fast (compare-terminal-bench.py).
  daemon-bench:
    needs: changes
    if: ${{ !endsWith(github.ref, '-check') && github.ref != 'refs/heads/natamux-ci/rust' && needs.changes.outputs.terminal == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-daemon-bench-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-daemon-bench-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
            rust-daemon-bench-${{ runner.os }}-
      - run: python3 scripts/ci-changes.py mtimes
      - id: build
        run: cargo test --release --locked -p natamux-daemon --test terminal_bench --no-run
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: The Node bench
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          NATAMUX_BENCH: "1"
        run: |
          pnpm install --frozen-lockfile --filter "@natamux/daemon..."
          pnpm --filter @natamux/core build
          pnpm --filter @natamux/daemon exec vitest run src/terminals/__tests__/terminal-bench.test.ts | tee "$RUNNER_TEMP/node-bench.txt"
      - name: The Rust bench
        run: cargo test --release --locked -p natamux-daemon --test terminal_bench -- --ignored --nocapture | tee "$RUNNER_TEMP/rust-bench.txt"
      - run: python3 scripts/compare-terminal-bench.test.py
      - run: python3 scripts/compare-terminal-bench.py "$RUNNER_TEMP/node-bench.txt" "$RUNNER_TEMP/rust-bench.txt"
      - name: Stamp the cache with this commit
        if: always() && steps.build.outcome == 'success'
        run: python3 scripts/ci-changes.py stamp
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.build.outcome == 'success'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-daemon-bench-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
      - name: Keep only the newest cache of this job
        if: always() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --ref "$GITHUB_REF" --key "rust-daemon-bench-${{ runner.os }}-" --json id,key,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[1:] | .[].id' |
            while read -r id; do gh cache delete "$id"; done

  # The tools come as prebuilt binaries at pinned versions; install-action checks their hashes.
  supply-chain:
    needs: changes
    if: ${{ !endsWith(github.ref, '-check') && needs.changes.outputs.lock == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-vet@0.10.0
      - run: cargo deny --locked check
      - run: cargo audit
      - run: cargo vet --locked

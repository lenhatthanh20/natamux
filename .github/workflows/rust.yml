name: Rust

# Checks of the Cargo workspace. Rust builds run here, not on the owner's Mac
# (docs/plan-rust-migration.md, "Safe local setup").
on:
  push:
    # natamux-ci/* holds snapshots that tasks push for a CI check (Check on CI).
    branches: [dev, 'natamux-ci/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # fmt, clippy, tests and the layer rule.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the version that rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: rust-check-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-check-${{ runner.os }}-
      - run: cargo xtask ci

  # The tools come as prebuilt binaries at pinned versions; install-action checks their hashes.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-vet@0.10.0
      - run: cargo deny --locked check
      - run: cargo audit
      - run: cargo vet --locked

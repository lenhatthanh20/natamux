name: Advisories

# rust.yml checks advisories only when a push changes the lock. An advisory can come out on any
# day, so this checks the lock of main every day.
on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # The tools that the supply-chain job of rust.yml saved.
      - id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-vet
            ~/.cargo/bin/cargo-about
          key: supply-chain-tools-${{ runner.os }}-cargo-deny-0.20.2-cargo-audit-0.22.2-cargo-vet-0.10.0-cargo-about-0.8.2
      - if: ${{ steps.tools.outputs.cache-hit != 'true' }}
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2
      - run: python3 scripts/advisory-dates.py
      - run: cargo deny --locked check advisories
      - run: scripts/audit.sh
      - run: scripts/audit.sh osv
      - run: scripts/audit.sh zed
        env:
          GH_TOKEN: ${{ github.token }}

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    # The project targets Node 22, an LTS line.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  # Rust crates live on dev until the cut over (docs/plan-rust-migration.md).
  # Dependabot reads this file from main only, so the entry is here.
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1

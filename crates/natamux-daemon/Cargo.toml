[package]
name = "natamux-daemon"
version = "1.0.15"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "natamux-daemon"
path = "src/main.rs"

[dependencies]
async-tungstenite.workspace = true
base64.workspace = true
futures.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true, features = ["server"] }
natamux-agents.workspace = true
natamux-core.workspace = true
natamux-git.workspace = true
natamux-proto.workspace = true
natamux-pty.workspace = true
natamux-screen.workspace = true
natamux-stages.workspace = true
natamux-store.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
subtle.workspace = true
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
natamux-git = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true

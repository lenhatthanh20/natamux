[package]
name = "natamux-app"
version = "1.0.12"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
assets.workspace = true
buffer_diff.workspace = true
editor.workspace = true
futures.workspace = true
getrandom.workspace = true
gpui.workspace = true
grammars.workspace = true
gpui_platform.workspace = true
language.workspace = true
markdown.workspace = true
natamux-client.workspace = true
natamux-core.workspace = true
natamux-proto.workspace = true
natamux-update = { path = "../natamux-update" }
release_channel.workspace = true
serde_json.workspace = true
settings.workspace = true
sha2.workspace = true
terminal.workspace = true
text.workspace = true
terminal_view.workspace = true
theme.workspace = true
theme_settings.workspace = true
tree-sitter.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-css.workspace = true
tree-sitter-diff.workspace = true
tree-sitter-gitcommit.workspace = true
tree-sitter-go.workspace = true
tree-sitter-gomod.workspace = true
tree-sitter-gowork.workspace = true
tree-sitter-jsdoc.workspace = true
tree-sitter-json.workspace = true
tree-sitter-md.workspace = true
tree-sitter-python.workspace = true
tree-sitter-regex.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-yaml.workspace = true
ui = { package = "natamux-ui", path = "../natamux-ui" }
util.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# The type a test renderer returns (components/kit_metrics.rs); the version gpui uses.
image = { version = "0.25", default-features = false }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["process", "signal"] }

# The Dock badge (app/dock_badge.rs): GPUI has no API for it. The versions gpui_macos uses.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSDockTile",
    "NSResponder",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSBundle",
    "NSError",
    "NSString",
] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
    "std",
    "bitflags",
    "block2",
    "UNUserNotificationCenter",
] }

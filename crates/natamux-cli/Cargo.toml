[package]
name = "natamux-cli"
version = "1.0.36"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "natamux"
path = "src/main.rs"

[[bin]]
name = "nmx"
path = "src/bin/nmx.rs"

[dependencies]
base64.workspace = true
natamux-agents.workspace = true
natamux-client.workspace = true
natamux-proto.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio.workspace = true

[lints]
workspace = true

# Version info in the exe (build.rs). The same version as natamux-app.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

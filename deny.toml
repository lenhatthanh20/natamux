# Config for cargo-deny 0.20. Rules: docs/plan-rust-migration.md, "Safe local setup".

[advisories]
# Each one OK'd by the owner (T-0143). All come through Zed's editor and terminal crates.
# .cargo/audit.toml keeps the same vulnerability list for cargo audit.
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa timing attack, no fix exists; only Zed's sign-in RPC uses it, and the app never signs in to Zed. Review by 2026-12-31." },
  { id = "RUSTSEC-2026-0194", reason = "quick-xml, fixed only in 0.41 (breaking); Zed's deps read local XML only. Review by 2026-12-31." },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml, fixed only in 0.41 (breaking); Zed's deps read local XML only. Review by 2026-12-31." },
  { id = "RUSTSEC-2026-0391", reason = "zstd stream context reuse, fixed only in 0.14 (breaking); only Zed's rust-embed (assets built into the app) and rpc call zstd. Review by 2026-12-31." },
  { id = "RUSTSEC-2026-0398", reason = "zstd-safe Seekable, fixed only in 8.2 (breaking); only Zed's rust-embed and rpc call zstd, and nothing reads a seekable archive. Review by 2026-12-31." },
  { id = "RUSTSEC-2026-0403", reason = "zstd-safe legacy-frame stream decoder, fixed only in 8.2 (breaking); only Zed's rust-embed and rpc call zstd. Review by 2026-12-31." },
  { id = "RUSTSEC-2026-0410", reason = "zstd-sys allocator shim on wasm32 only; Natamux is never built for wasm32. Review by 2026-12-31." },
  { id = "RUSTSEC-2025-0052", reason = "async-std unmaintained; a Zed dependency, no known hole. Review by 2026-12-31." },
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; a Zed dependency (macro only), no known hole. Review by 2026-12-31." },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; a Zed dependency, no known hole. Review by 2026-12-31." },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; a Zed dependency, no known hole. Review by 2026-12-31." },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; a Zed dependency (Linux only), no known hole. Review by 2026-12-31." },
  { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; a Zed dependency (Linux only), no known hole. Review by 2026-12-31." },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; a Zed dependency (Linux only), no known hole. Review by 2026-12-31." },
]

[licenses]
allow = [
  "GPL-3.0-or-later",
  "MIT",
  "MPL-2.0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates, by path; they are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Zed (the owner's fork of it, docs/rust-phase1.md) and the owner's forks of the repos that its
# manifest pins at our Zed rev (Cargo.toml, "Every git dependency"). Each one by its exact URL.
allow-git = [
  "https://github.com/lenhatthanh20/alacritty",
  "https://github.com/lenhatthanh20/async-process.git",
  "https://github.com/lenhatthanh20/async-tar",
  "https://github.com/lenhatthanh20/async-task.git",
  "https://github.com/lenhatthanh20/calloop",
  "https://github.com/lenhatthanh20/dap-types",
  "https://github.com/lenhatthanh20/font-kit",
  "https://github.com/lenhatthanh20/lsp-types",
  "https://github.com/lenhatthanh20/notify",
  "https://github.com/lenhatthanh20/proptest",
  "https://github.com/lenhatthanh20/scap",
  "https://github.com/lenhatthanh20/trash-rs",
  "https://github.com/lenhatthanh20/tree-sitter",
  "https://github.com/lenhatthanh20/tree-sitter-cpp",
  "https://github.com/lenhatthanh20/tree-sitter-git-commit",
  "https://github.com/lenhatthanh20/tree-sitter-go-mod",
  "https://github.com/lenhatthanh20/tree-sitter-go-work",
  "https://github.com/lenhatthanh20/tree-sitter-markdown",
  "https://github.com/lenhatthanh20/tree-sitter-typescript",
  "https://github.com/lenhatthanh20/tree-sitter-yaml",
  "https://github.com/lenhatthanh20/wasm_thread",
  "https://github.com/lenhatthanh20/xim-rs.git",
  "https://github.com/lenhatthanh20/zed",
]

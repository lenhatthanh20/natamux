# Config for cargo-deny 0.20. Rules: docs/plan-rust-migration.md, "Safe local setup".

[advisories]
# Each one OK'd by the owner (T-0143). All come through gpui and gpui_platform, the Zed
# crates the app keeps (Apache-2.0).
# .cargo/audit.toml keeps the same vulnerability list for cargo audit.
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39, fixed only in 0.41 (breaking); only zbus_xml 5.1 (gpui_platform's Linux crates) still uses it, on local XML only; wayland-scanner is on 0.41. Review by 2026-12-31." },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39, fixed only in 0.41 (breaking); only zbus_xml 5.1 (gpui_platform's Linux crates) still uses it, on local XML only; wayland-scanner is on 0.41. Review by 2026-12-31." },
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; gpui's dependency metal (macOS) uses it (macro only), no known hole. Review by 2026-12-31." },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; gpui uses it through usvg, no known hole. Review by 2026-12-31." },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; gpui uses it (also through fontdb and rustybuzz), no known hole. Review by 2026-12-31." },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; gpui_platform's Linux crates (accessibility, portals, notifications) use it, no known hole. Review by 2026-12-31." },
  { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; gpui_platform's Linux crates (accessibility, portals, notifications) use it, no known hole. Review by 2026-12-31." },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; gpui_platform's Linux crates (accessibility, portals, notifications) use it, no known hole. Review by 2026-12-31." },
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no maintained release exists; only gpui and scheduler use it, no known hole. Review by 2026-12-31." },
]

[licenses]
allow = [
  "MIT",
  "MPL-2.0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates, by path; they are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Zed (the owner's fork of it, docs/rust-phase1.md) and the owner's forks of the repos that its
# manifest pins at our Zed rev (Cargo.toml, "Every git dependency"). Each one by its exact URL.
allow-git = [
  "https://github.com/lenhatthanh20/async-process.git",
  "https://github.com/lenhatthanh20/async-task.git",
  "https://github.com/lenhatthanh20/calloop",
  "https://github.com/lenhatthanh20/font-kit",
  "https://github.com/lenhatthanh20/tree-sitter",
  "https://github.com/lenhatthanh20/tree-sitter-cpp",
  "https://github.com/lenhatthanh20/tree-sitter-git-commit",
  "https://github.com/lenhatthanh20/tree-sitter-go-mod",
  "https://github.com/lenhatthanh20/tree-sitter-go-work",
  "https://github.com/lenhatthanh20/tree-sitter-markdown",
  "https://github.com/lenhatthanh20/tree-sitter-typescript",
  "https://github.com/lenhatthanh20/tree-sitter-yaml",
  "https://github.com/lenhatthanh20/xim-rs.git",
  "https://github.com/lenhatthanh20/zed",
]

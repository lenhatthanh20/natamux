# Development: docker compose up
# Runs the daemon and the dashboard against the source in this folder, and reloads on a change.
# The dashboard is on http://localhost:5173 and the daemon on http://localhost:4317.
# Both ports are published to loopback only; in a codespace they are forwarded from there.
name: natamux-dev

x-dev: &dev
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
  image: natamux-dev
  working_dir: /workspaces/natamux
  # The folder is mounted at the same path as in the codespace.
  volumes:
    - .:/workspaces/natamux
  # Files that the containers write stay yours. In a codespace 1000 is already right.
  user: "${NATAMUX_UID:-1000}:${NATAMUX_GID:-1000}"
  environment: &dev-env
    CI: "true"
    HOME: /tmp
    # The desktop app is not run in the containers.
    ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    NATAMUX_TOKEN: ${NATAMUX_TOKEN:-devtoken}
    # For a push and a pull request. scripts/dev.sh takes it from the codespace (GITHUB_TOKEN).
    GH_TOKEN: ${GH_TOKEN:-}
    # git refuses a folder that another user owns, unless it is listed. The name and email are
    # the ones of commits made from the dashboard; scripts/dev.sh takes yours from git.
    GIT_CONFIG_COUNT: "3"
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: /workspaces/natamux
    GIT_CONFIG_KEY_1: user.name
    GIT_CONFIG_VALUE_1: ${NATAMUX_GIT_NAME:-Natamux}
    GIT_CONFIG_KEY_2: user.email
    GIT_CONFIG_VALUE_2: ${NATAMUX_GIT_EMAIL:-natamux@localhost}

services:
  # Installs the packages the first time (when node_modules is missing) and builds the
  # packages that the others use.
  setup:
    <<: *dev
    command: sh -c "[ -d node_modules ] || pnpm install --frozen-lockfile; pnpm --filter '@natamux/cli...' build"
    restart: "no"

  # Rebuilds @natamux/core when you change it. Restart `daemon` to pick that up.
  core:
    <<: *dev
    command: pnpm --filter @natamux/core exec tsc -p tsconfig.build.json --watch --preserveWatchOutput
    depends_on:
      setup:
        condition: service_completed_successfully

  daemon:
    <<: *dev
    command: pnpm --filter @natamux/daemon dev
    environment:
      <<: *dev-env
      NATAMUX_HOST: 0.0.0.0
      NATAMUX_DATA_DIR: /workspaces/natamux/.natamux
      NATAMUX_REPO_DIR: /workspaces/natamux
      # scripts/dev.sh seed sets it to the fake agent.
      NATAMUX_CLAUDE_COMMAND: ${NATAMUX_CLAUDE_COMMAND:-}
    ports:
      - "127.0.0.1:4317:4317"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4317/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 15s
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    <<: *dev
    command: pnpm --filter @natamux/web dev --host 0.0.0.0
    environment:
      <<: *dev-env
      NATAMUX_DAEMON_URL: http://daemon:4317
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 10s
    depends_on:
      daemon:
        condition: service_healthy
